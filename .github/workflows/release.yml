name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:                   # dry run: builds the zip and notes from the chosen ref and uploads them as artifacts; publishes nothing
    inputs:
      version:
        description: Changelog section to take the notes from (a version such as 0.2.0, or Unreleased)
        default: Unreleased

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the playable zip
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NAME: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compile the game script and audio banks
        run: node dev/check.mjs
      - name: Build the zip
        run: |
          name="${NAME//\//-}"            # a branch like fix/x makes slaghouse-fix-x.zip; tags have no slash
          mkdir -p dist/slaghouse
          cp slaghouse.html sfx_bank.js music_bank.js sfx_bank_aac.js music_bank_aac.js LICENSE README.md CHANGELOG.md dist/slaghouse/
          (cd dist && zip -r -X "slaghouse-${name}.zip" slaghouse)
      - name: Pull this version's notes from the changelog
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="${VERSION:-${NAME#v}}"
          awk -v h="## [$v]" 'index($0, h) == 1 { on = 1; next } on && (/^## \[/ || /^\[[^]]*\]: /) { exit } on' CHANGELOG.md > dist/notes.md
          test -s dist/notes.md || echo "See CHANGELOG.md." > dist/notes.md
      - name: Upload the dry run
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: slaghouse-dry-run
          path: |
            dist/slaghouse
            dist/notes.md
            dist/*.zip
          if-no-files-found: error
      - name: Create the release, or add the zip to the one already there
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip="dist/slaghouse-${GITHUB_REF_NAME}.zip"
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$zip" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$zip" --title "SLAGHOUSE $GITHUB_REF_NAME" --notes-file dist/notes.md --verify-tag
          fi
