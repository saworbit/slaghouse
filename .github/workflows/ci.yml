name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Compile the game script and audio banks
        run: node dev/check.mjs

  playtest:
    name: Headless play-test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install playwright-core (uses the runner's Chrome, no browser download)
        run: npm ci --prefix dev/playtest
      - name: Two-tab, DAILY and checkpoint checks, then a full campaign run
        run: node dev/playtest/run.mjs

  brutal:
    name: Brutal campaign seeds
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install playwright-core (uses the runner's Chrome, no browser download)
        run: npm ci --prefix dev/playtest
      - name: Full campaigns on Brutal, eight seeds, at least seven must win
        run: node dev/playtest/run.mjs --campaign --brutal --seeds=91,137,7,11,10,4,6,14 --min-wins=7
