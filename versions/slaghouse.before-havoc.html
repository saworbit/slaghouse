function buildRagParts(scene) {
  const put = (key, c) => { addTex(scene, key, c); addTex(scene, key + '_w', whiteCopy(c)); };   // + white hit-flash copy
  for (const kind in RAG) {
    const D = RAG[kind], lw = D.legW || 3;
    const src = makeSprite(D.fw, D.fh, D.body, null), sx = src.getContext('2d');
    (D.clear || []).forEach(([x, y, w, h]) => sx.clearRect(x, y, w, h));
    const cut = (cv, [x, y, w, h], stump) => {
      const { c, ctx } = mkCanvas(w + 2, h + 2);
      ctx.drawImage(cv, x, y, w, h, 1, 1, w, h);
      if (stump) {                                                     // raw neck stump where the head was
        const d = ctx.getImageData(0, 0, w + 2, h + 2).data, op = (i, j) => d[(j * (w + 2) + i) * 4 + 3] > 0;
        if (D.up) { let j0 = 1; while (j0 < h && ![...Array(w + 2).keys()].some(i => op(i, j0))) j0++;
          for (let i = 0; i < w + 2; i++) { if (op(i, j0)) R(ctx, i % 3 ? '#a01818' : '#6a0c0c', i, j0); if (op(i, j0 + 1) && i % 2) R(ctx, '#5a0a0a', i, j0 + 1); }
          R(ctx, '#ddd3b0', (w + 2) >> 1, j0); }
        else { let i0 = w; while (i0 > 1 && ![...Array(h + 2).keys()].some(j => op(i0, j))) i0--;
          for (let j = 0; j < h + 2; j++) { if (op(i0, j)) R(ctx, j % 3 ? '#a01818' : '#6a0c0c', i0, j); if (op(i0 - 1, j) && j % 2) R(ctx, '#5a0a0a', i0 - 1, j); }
          R(ctx, '#ddd3b0', i0, (h + 2) >> 1); }
      }
      outlineCanvas(ctx, w + 2, h + 2, '#06070a');
      return c;
    };
    put(`rg_${kind}_head`, cut(src, D.head));
    put(`rg_${kind}_torso`, cut(src, D.torso));
    put(`rg_${kind}_torsoX`, cut(src, D.torso, true));
    const legSrc = makeSprite(D.fw, D.fh, D.leg || (x => drawPLeg(x, 9, 15, 0, 0, false, D.P, lw)), null);
    put(`rg_${kind}_thigh`, cut(legSrc, D.thigh || [8, 15, lw, 3]));
    put(`rg_${kind}_shin`, cut(legSrc, D.shin || [8, 18, lw + 1, 5]));
    if (D.P) put(`rg_${kind}_arm`, makeSprite(D.blade ? 4 : 5, D.blade ? 11 : 9, c => {
      if (D.blade) { R(c, ST.skin, 1, 1, 2, 5); R(c, ST.skinD, 2, 1, 1, 5); R(c, ST.blade, 2, 6, 1, 4); R(c, ST.bladeHi, 2, 6, 1, 1); }
      else { const P = D.P; R(c, P.b, 1, 1, 3, 5); R(c, P.c, 1, 1, 1, 5); R(c, P.a, 3, 1, 1, 5); R(c, P.k, 1, 6, 3, 2); }
    }, '#06070a'));
  }
}

function drawDrone(ctx, sway, charge) {          // 18x16 hovering eye-sentry

  const cx = 9, cy = 7.5, r = 5.6;
  for (let y = 1; y < 14; y++) for (let x = 2; x < 17; x++) {
    const dx = x + 0.5 - cx, dy = y + 0.5 - cy; if (dx * dx + dy * dy > r * r) continue;
    const l = (-dx * 0.55 - dy * 0.85) / r;
    R(ctx, l > 0.45 ? EP.ml : l > -0.2 ? EP.m : EP.md, x, y);
  }
  for (let x = 4; x < 15; x++) if ((x + 0.5 - cx) ** 2 + (10.5 - cy) ** 2 <= r * r) R(ctx, '#2a2f36', x, 10);
  for (let y = 4; y < 12; y++) for (let x = 8; x < 16; x++) {
    const dx = x + 0.5 - 11.5, dy = y + 0.5 - 7.5, d2 = dx * dx + dy * dy;
    if (d2 <= 7.3) R(ctx, d2 > 4.4 ? '#1a1d22' : '#e8e2d8', x, y);

// =============================================================================
//  LIGHTWEIGHT PIXEL PARTICLES  (pooled, square "pixels", tile-aware)
//  Phaser's emitter can't collide with the tile grid; ours lets sparks bounce and
//  blood droplets stick: mode 1 = bounce, mode 2 = paint onto the level and die.
// =============================================================================
class FX {
  constructor(scene, max, depth = 12) {
    this.gN = scene.add.graphics().setDepth(depth);
    this.gA = scene.add.graphics().setDepth(depth + 1).setBlendMode(ADD);
    this.pool = []; this.live = []; this.solid = null; this.paint = null;
    for (let i = 0; i < max; i++) this.pool.push({});
  }
  emit(x, y, o) {
    const n = o.n || 1, spread = o.spread === undefined ? Math.PI * 2 : o.spread, ang = o.angle || 0, j = o.jitter || 0;
    for (let i = 0; i < n; i++) {
      const p = this.pool.pop(); if (!p) return;
      const a = ang + (Math.random() - 0.5) * spread, sp = rand(o.speed[0], o.speed[1]);
      p.x = x + (j ? rand(-j, j) : 0); p.y = y + (j ? rand(-j, j) : 0);
      p.vx = Math.cos(a) * sp + (o.vx || 0); p.vy = Math.sin(a) * sp + (o.vy || 0);
      p.max = p.life = rand(o.life[0], o.life[1]);
      p.s0 = o.size[0]; p.s1 = o.size[1]; p.cols = o.cols; p.fixed = o.randCol ? pick(o.cols) : undefined;
      p.a0 = o.alpha ? o.alpha[0] : 1; p.a1 = o.alpha ? o.alpha[1] : 1;
      p.g = o.g || 0; p.drag = o.drag || 0; p.add = !!o.add; p.mode = o.mode || 0;
      this.live.push(p);
    }
  }
  update(dt) {
    const L = this.live, solid = this.solid;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); this.pool.push(p); continue; }
      p.vy += p.g * dt;
      if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; }
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (p.mode && solid && solid(nx, ny)) {
        if (p.mode === 2) { if (this.paint) this.paint(nx, ny, p, solid(nx, p.y)); L[i] = L[L.length - 1]; L.pop(); this.pool.push(p); continue; }
        if (solid(nx, p.y)) p.vx *= -0.45; else p.x = nx;
        if (solid(p.x, ny)) { p.vy *= -0.35; p.vx *= 0.75; } else p.y = ny;
        continue;
      }
      p.x = nx; p.y = ny;
    }
  }
  draw() {
    const gN = this.gN, gA = this.gA; gN.clear(); gA.clear();
    for (const p of this.live) {
      const t = 1 - p.life / p.max, s = Math.round(p.s0 + (p.s1 - p.s0) * t);
      if (s <= 0) continue;
      const col = p.fixed !== undefined ? p.fixed : p.cols[Math.min(p.cols.length - 1, (t * p.cols.length) | 0)];
      const g = p.add ? gA : gN;
      g.fillStyle(col, p.a0 + (p.a1 - p.a0) * t);
      g.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }
  }
}

  // ---------------------------------------------------------------- world ----
  buildWorld() {
    const offX = (VIEW_W - VIEW_W / ZOOM) / 2, offY = (VIEW_H - VIEW_H / ZOOM) / 2;   // zoom pivots on camera centre
    for (const [key, sf, depth] of [['bgFar', BG.far, -30], ['bgMid', BG.mid, -20]]) {
      this.add.image(offX * (1 - sf) - BG.pad, offY * (1 - sf) - BG.pad, key).setOrigin(0).setScrollFactor(sf).setDepth(depth);
    }
    // Level art lives in a CanvasTexture so blood, bullet holes and scorch marks can be painted onto it permanently.
    const tex = this.textures.exists('level') ? this.textures.get('level') : this.textures.createCanvas('level', LW, LH);
    const ctx = tex.context || tex.getContext();
    ctx.globalCompositeOperation = 'source-over'; ctx.clearRect(0, 0, LW, LH); ctx.drawImage(ART.levelBase, 0, 0);
    tex.refresh();
    this.lvlTex = tex; this.lvlCtx = ctx;
    this.add.image(0, 0, 'level').setOrigin(0).setDepth(0);

    this.solids = this.physics.add.staticGroup();
    this.oneways = this.physics.add.staticGroup();
    for (const r of mergeRects(this.grid, '#')) this.solids.add(this.add.zone(r.x * TS + r.w * TS / 2, r.y * TS + r.h * TS / 2, r.w * TS, r.h * TS));
    for (const r of mergeRects(this.grid, '=', true)) {
      const z = this.add.zone(r.x * TS + r.w * TS / 2, r.y * TS + 3, r.w * TS, 6);
      this.oneways.add(z);
      const cc = z.body.checkCollision; cc.down = false; cc.left = false; cc.right = false;   // standard Arcade one-way pattern
    }
    this.initTerrain();

    this.lamps = DECOR.lamps.map(([x, y]) => {
      const img = this.add.image(x, y, 'lamp').setDepth(2);
      return { cone: this.add.image(x, y + 3, 'cone').setOrigin(0.5, 0).setBlendMode(ADD).setTint(0xffc070).setAlpha(0.16).setScale(1.4, 1.6).setDepth(18),
               gl: this.add.image(x, y + 3, 'glow').setBlendMode(ADD).setTint(0xffb050).setScale(2.2).setAlpha(0.5).setDepth(18),
               t: Math.random() * 10, ph: Math.random() * 6, drop: 0, img, x, y, falling: false, dead: false, vy: 0, hits: new Set() };
    });
    this.beacons = DECOR.beacons.map(([x, y], i) => ({ img: this.add.image(x, y, 'glow').setBlendMode(ADD).setTint(0xff2a14).setScale(1.2).setDepth(18), ph: i * 1.7 }));
    this.vents = DECOR.vents.map(([x, y], i) => ({ x, y, t: i * 1.9, acc: 0 }));
    this.fx = new FX(this, 1500, 12);
    this.fx.solid = (x, y) => this.solidAt(x, y);
    this.fx.paint = (x, y, p, wall) => this.paintDrop(x, y, p.fixed, wall);
  }

  spawnBarrels(fx) {                                                   // explosive drums; restocked every wave

      k.body.setSize(10, 13, true); k.body.setAllowGravity(true); k.body.setBounce(0.2); k.body.setDrag(200, 0);

      e.glow = this.add.image(x, y, 'glow').setBlendMode(ADD).setTint(0xff8a20).setScale(1.5).setAlpha(0.45).setDepth(4.6);   // heat halo behind the hull

  buildColliders() {
    const P = this.physics;
    P.add.collider(this.player, this.solids);
    P.add.collider(this.player, this.oneways, null, () => this.time.now >= this.dropUntil);
    P.add.collider(this.enemies, this.solids);
    P.add.collider(this.enemies, this.oneways, null, e => e.kind !== 'drone' && !FLIERS.has(e.kind) && this.time.now >= (e.dropUntil || 0));
    P.add.overlap(this.saws, this.enemies, this.onSawHit, null, this);
    P.add.collider(this.barrels, this.solids);
    P.add.collider(this.barrels, this.oneways);
    P.add.overlap(this.bullets, this.barrels, (b, k) => { if (b.active && k.active) { const x = b.x, y = b.y; b.disableBody(true, true); this.fxSparks(x, y, 4, b.ang + Math.PI, 1.4); this.damageBarrel(k, b.dmg); } });
    P.add.overlap(this.saws, this.barrels, (s, k) => { if (s.active && k.active && !(s.hitMap.get(k) > this.time.now)) { s.hitMap.set(k, this.time.now + 300); this.damageBarrel(k, TUNE.SAW.damage); } });
    P.add.overlap(this.player, this.ebullets, this.onEBulletHit, null, this);
    P.add.collider(this.gibs, this.solids);
    P.add.collider(this.gibs, this.oneways);
    P.add.overlap(this.bullets, this.enemies, this.onBulletHit, null, this);
    P.add.overlap(this.rockets, this.enemies, this.onRocketHit, null, this);
    P.add.collider(this.grenades, this.solids);
    P.add.collider(this.grenades, this.oneways);
    P.add.overlap(this.grenades, this.enemies, this.onGrenadeHit, null, this);
    // single sprite first: Arcade then always passes (sprite, groupChild) to the callback
    P.add.overlap(this.player, this.bolts, this.onBoltHit, null, this);
    P.add.overlap(this.player, this.enemies, this.onTouchEnemy, null, this);
    P.add.overlap(this.player, this.gibs, this.onKickGib, null, this);
    P.add.collider(this.mines, this.solids); P.add.collider(this.mines, this.oneways);
    P.add.collider(this.charges, this.solids); P.add.collider(this.charges, this.oneways);
    P.add.collider(this.haywires, this.solids);
    P.add.collider(this.canisters, this.solids); P.add.collider(this.canisters, this.oneways);

  ignite(e, t) {

  // ------------------------------------------------------------- singularity ----
  // Slow orb that anchors on contact into a well: drags enemies, gibs (and a little of you) in, then implodes.
  spawnOrb(x, y, a) {
    const o = this.orbs.getFirstDead(false); if (!o) return;
    const W = TUNE.SING;
    o.enableBody(true, x, y, true, true); o.body.setAllowGravity(false); o.body.setSize(6, 6, true);
    o.setVelocity(Math.cos(a) * W.speed, Math.sin(a) * W.speed);
    Object.assign(o, { mode: 'fly', t: W.travel, px: x, py: y });
    o.glow.setVisible(true).setPosition(x, y).setScale(1).setAlpha(0.8); o.core.setVisible(false);
  }
  updateOrbs(dt, now) {
    const W = TUNE.SING;

      if (!o.active) continue;

      if (o.mode === 'fly') {
        const hit = this.sweep(o.px, o.py, o.x, o.y), hitE = this.enemyAt(o.x, o.y, 3);
        if (hit || hitE || o.t <= 0) {
          if (hit) o.body.reset(hit.x, hit.y);
          o.body.setVelocity(0, 0); o.mode = 'well'; o.t = W.well;
          o.core.setVisible(true).setPosition(o.x, o.y).setScale(0.3);

        } else {
          this.fx.emit(o.x, o.y, { n: 1, speed: [0, 10], life: [0.2, 0.4], size: [3, 1], cols: [0xffffff, 0xd0a0ff, 0x7030d0], add: true });

      }

      o.core.setPosition(cx, cy).setScale(0.6 + k * 0.6 + Math.sin(now / 40) * 0.05).setRotation(now / 200);
      o.glow.setPosition(cx, cy).setScale(2.5 + Math.sin(now / 60) * 0.4).setAlpha(0.7);
      const pull = (b, str, cap) => {
        const dx = cx - b.center.x, dy = cy - b.center.y, d = Math.hypot(dx, dy);

      }

        const th = rand(0, Math.PI * 2), r = rand(0.5, 1) * R * 0.8;
        this.fx.emit(cx + Math.cos(th) * r, cy + Math.sin(th) * r, { n: 1, speed: [0, 0], vx: -Math.sin(th) * 90 - Math.cos(th) * 70, vy: Math.cos(th) * 90 - Math.sin(th) * 70, life: [0.4, 0.7], size: [2, 1], cols: [0xffffff, 0xd0a0ff, 0x8040e0], add: true, drag: 0.5 });
      }

  }

  // ----------------------------------------------------------------- barrels ----
  damageBarrel(k, dmg, fuseCap) {
    if (!k.active) return;
    k.hp -= dmg;
    this.fxSparks(k.x, k.y - 4, 3, -Math.PI / 2, 2, [40, 140]);
    if (k.hp <= 0) k.fuse = k.fuse > 0 ? Math.min(k.fuse, fuseCap || 0.06) : (fuseCap || 0.06);

  }

  explodeBarrel(k) {
    const x = k.x, y = k.y; k.disableBody(true, true);

  }
  updateBarrels(dt) {

      if (k.kicked && k.prevV > 150 && (b.blocked.left || b.blocked.right || b.blocked.up || b.blocked.down)) { this.explodeBarrel(k); continue; }   // punted drums go off on impact
      if (k.kicked && sp < 20 && b.blocked.down) k.kicked = false;
      k.prevV = sp;
      if (k.burning && Math.random() < 0.6) this.fx.emit(k.x + rand(-3, 3), k.y - 7, { n: 1, angle: -Math.PI / 2, spread: 0.6, speed: [20, 60], life: [0.2, 0.45], size: [4, 1], cols: [0xffffff, 0xffe46a, 0xff8a1f, 0xc03010], add: true, g: -40 });
      if (k.fuse > 0) {
        k.fuse -= dt;
        if (k.fuse < 0.6) { if (Math.floor(k.fuse * 16) % 2) k.setTint(0xffe060); else k.clearTint(); }
        if (k.fuse <= 0) this.explodeBarrel(k);
      }
    }
  }

  // ------------------------------------------------------------ boss hazards ----
  updateHazards(dt, now) {
    const pb = this.player.body, alive = this.state !== 'dead';
    for (const s of this.slagList) {
      if (!s.active) continue;
      s.glow.setPosition(s.x, s.y);
      if (Math.random() < 0.7) this.fx.emit(s.x, s.y, { n: 1, speed: [0, 15], life: [0.2, 0.4], size: [3, 1], cols: [0xffe080, 0xff8a20, 0xc03010], add: true, g: -30 });
      const hit = this.sweep(s.px, s.py, s.x, s.y);
      if (hit || (s.body.velocity.y > 0 && this.standAt(s.x, s.y + 3))) { this.slagImpact(hit ? hit.x : s.x, hit ? hit.y : s.y); s.disableBody(true, true); s.glow.setVisible(false); continue; }
      s.px = s.x; s.py = s.y;
    }
    for (let i = this.puddles.length - 1; i >= 0; i--) {              // molten puddles: burn whoever stands in them
      const P = this.puddles[i]; P.t -= dt;
      if (P.t <= 0) { this.puddles.splice(i, 1); continue; }
      if (Math.random() < 0.8) this.fx.emit(P.x + rand(-P.w / 2, P.w / 2), P.y - 1, { n: 1, angle: -Math.PI / 2, spread: 0.5, speed: [20, 60], life: [0.2, 0.5], size: [4, 1], cols: [0xffffff, 0xffe46a, 0xff8a1f, 0xc03010], add: true, g: -40 });
      P.tick -= dt;

        for (const e of this.enemies.getChildren()) if (e.alive && e.kind !== 'boss' && Math.abs(e.body.center.x - P.x) < P.w / 2 + 4 && Math.abs(e.body.bottom - P.y) < 6) this.ignite(e, 1.5);

      this.fx.emit(w.x, w.y - 2, { n: 2, angle: -Math.PI / 2, spread: 0.5, speed: [60, 160], life: [0.2, 0.4], size: [4, 1], cols: [0xffffff, 0xffe46a, 0xff8a1f, 0xc03010], add: true, g: 300 });

      if (!w.hit && alive && Math.abs(pb.center.x - w.x) < 10 && pb.bottom > w.y - 18 && pb.bottom <= w.y + 4) { w.hit = true; this.hurtPlayer(20, w.x - w.dir * 10); }

  }

  // ------------------------------------------------------------------- ticks ----
  // Little bomb-crawlers: path to you, leap the last bit, arm (beeping, swelling) and pop. Shoot them near
  // their friends: a dead tick still blows, and blasts chain.
  updateTick(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, T = TUNE.TICK, onGround = b.blocked.down || b.touching.down, pb = this.player.body;
    e.jumpCd -= dt; e.repathT -= dt;

    if (e.armT > 0) {
      e.armT -= dt; if (onGround) b.velocity.x *= Math.pow(0.01, dt);
      e.fr = Math.floor(now / 50) % 2 ? 'ka' : 'k0'; e.setScale(1 + (1 - e.armT / (T.fuse / 1000)) * 0.4);
      if (Math.floor(now / 90) % 2 === 0) Sfx.beep();
      if (e.armT <= 0) this.tickBoom(e);
      return;
    }
    if (!e.aggro && alive && (e.sees || dist < 110)) { e.aggro = true; Sfx.chirp(); this.popAlert(e); }
    if (e.aggro && alive && e.stunT <= 0) {

      if (onGround && e.sees && dist < 95 && e.jumpCd <= 0) {

      } else if (onGround && !e.navAir) {

        if (!this.followPath(e, now, onGround, T.speed, dt)) b.velocity.x = approach(b.velocity.x, Math.sign(dx) * T.speed, 1600 * dt);
      } else if (e.navAir) this.followPath(e, now, onGround, T.speed, dt);
    } else if (onGround && e.stunT <= 0) b.velocity.x = approach(b.velocity.x, 0, 600 * dt);
    if (Math.abs(b.velocity.x) > 5) e.dir = b.velocity.x > 0 ? 1 : -1;
    e.animT += dt * Math.abs(b.velocity.x) / 12;
    e.fr = Math.floor(e.animT) % 2 ? 'k1' : 'k0';
  }
  tickBoom(e) {

    const x = e.body.center.x, y = e.body.center.y;
    this.killEnemy(e, 0, -1, 'tickboom');

  }

  // ------------------------------------------------------------------ sniper ----
  // Picks high, far perches with a view of you, holds still to take a long tracked shot (blue laser, locks
  // for the last quarter), then relocates. Runs if you get close.
  thinkSniper(e, dt, now, c) {
    const T = TUNE.SNIPER;
    e.fireCd -= dt; e.repickT -= dt;
    switch (e.ai) {
      case 'idle': this.lookAround(e, dt); return 'hold';
      case 'dodge': if (c.onGround && now > e.aiUntil + 120) { e.ai = 'engage'; e.repickT = 0; } return 'free';
      case 'aim': {
        const k = (now - e.aimStart) / T.aimMs;
        if (k < T.lockAt) e.aimA = this.leadAngle(e, T.bulletSpeed);
        if ((!c.canSee && k < 0.6) || c.dist < 100) { e.ai = 'engage'; e.fireCd = 0.6; e.repickT = 0; return 'hold'; }
        if (now >= e.aiUntil) { this.sniperShoot(e); e.fireCd = T.fireCd; e.ai = 'engage'; e.repickT = 0.4; }
        return 'hold';
      }
      default: {
        if (!c.alive || now - e.lkT > 9000) { e.ai = 'idle'; e.aggro = false; return 'hold'; }
        if (c.onGround && !e.navAir && e.repickT <= 0) {
          if (c.dist < 130) { e.repickT = 1.2; this.pickPosition(e, 'retreat'); }
          else { e.repickT = rand(4, 6); if (!this.pickPosition(e, 'snipe')) this.pickPosition(e, 'attack'); }
        }

        if (c.canSee && c.onGround && !e.navAir && settled && e.fireCd <= 0 && c.dist > 100) {

  sniperShoot(e) {

    const mx = sx + Math.cos(e.aimA) * 31, my = sy + Math.sin(e.aimA) * 31;
    e.recoil = 4;
    this.spawnLight(mx, my, 'glow', 0x9adcff, 1, 2, 1, 0.12); this.fxSparks(mx, my, 6, e.aimA, 0.5, [80, 220]); this.fxSmoke(mx, my, 3);
    Sfx.snipe();
    if (this.solidAt(mx, my) || !this.los(sx, sy, mx, my)) return;
    const b = this.ebullets.getFirstDead(false); if (!b) return;
    b.setTexture('sbullet'); b.enableBody(true, mx, my, true, true); b.body.setAllowGravity(false); b.body.setSize(4, 4, true);
    b.setRotation(a); b.setVelocity(Math.cos(a) * T.bulletSpeed, Math.sin(a) * T.bulletSpeed);
    Object.assign(b, { life: 1.2, px: mx, py: my, ang: a, dmg: T.damage, snipe: true });
  }

  // -------------------------------------------------------------------- boss ----
  // THE SMELTER: walks its level, leaps between levels (each landing sends slam waves along the floor),
  // lobs slag mortars at marked spots, breathes fire from phase 2, spits ticks in phase 3.
  // Hits to the head / furnace (top of the body) crit for x1.5.
  updateBoss(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, onGround = b.blocked.down || b.touching.down, pb = this.player.body;
    const hpF = e.hp / e.def.hp, phase = hpF > 0.66 ? 1 : hpF > 0.33 ? 2 : 3, rage = phase === 3 ? 1.5 : phase === 2 ? 1.25 : 1;
    e.stunT = 0;
    if (phase !== e.phase) { e.phase = phase; BUS.emit('callout', phase === 2 ? 'IT GETS HOTTER' : 'MELTDOWN!'); Sfx.roar(); this.shake(500, 0.012); e.atkCd = 1.2; }
    if (onGround && !e.wasGround && e.airT > 0.25) this.bossSlam(e);
    e.airT = onGround ? 0 : e.airT + dt; e.wasGround = onGround;
    if (Math.random() < 0.35) this.fx.emit(e.x - e.dir * 13 + rand(-3, 3), b.top - 6, { n: 1, angle: -Math.PI / 2, spread: 0.4, speed: [20, 50], life: [0.6, 1.2], size: [3, 9], cols: [0x6a5a50, 0x403530, 0x2a2420], alpha: [0.5, 0], g: -20, drag: 1 });
    if (e.introT > 0) { e.introT -= dt; b.velocity.x = 0; e.fr = 'w0'; if (e.introT < 1.3 && !e.roared) { e.roared = true; Sfx.roar(); this.shake(700, 0.012); } return; }
    if (!alive) { b.velocity.x = approach(b.velocity.x, 0, 400 * dt); e.fr = 'w0'; return; }
    e.atkCd -= dt * rage; e.leapCd -= dt;
    switch (e.ai) {
      case 'mortarWind':
        b.velocity.x = 0; e.fr = 'wind';
        if (now >= e.aiUntil) { this.bossMortar(e, phase); e.ai = 'walk'; e.atkCd = 2.4 / rage; }
        return;
      case 'breathWind':
        b.velocity.x = 0; e.fr = 'breath';
        if (now >= e.aiUntil) { e.ai = 'breath'; e.aiUntil = now + 1500; e.breathA = Math.atan2(pb.center.y - (b.top + 10), pb.center.x - e.x); Sfx.roar(); }
        return;
      case 'breath': {
        b.velocity.x = 0; e.fr = 'breath';
        const mx = e.x + e.dir * 18, my = b.top + 10, want = Math.atan2(pb.center.y - my, pb.center.x - mx);
        let da = want - e.breathA; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
        e.breathA += clamp(da, -1.1 * dt, 1.1 * dt);                   // sweeps after you, but slowly
        e.dir = Math.cos(e.breathA) >= 0 ? 1 : -1;
        for (let i = 0; i < 3; i++) this.fx.emit(mx, my, { n: 1, angle: e.breathA, spread: 0.45, speed: [200, 280], life: [0.35, 0.55], size: [3, 9], cols: [0xffffff, 0xfff0a0, 0xffb040, 0xff6a1a, 0xc03010, 0x502820], add: true, drag: 1.2, g: -50 });
        if (Math.random() < 0.5) this.spawnLight(mx + Math.cos(e.breathA) * 50, my + Math.sin(e.breathA) * 50, 'glow', 0xff8a30, 3, 3.6, 0.5, 0.1);
        e.breathTick = (e.breathTick || 0) - dt;
        if (e.breathTick <= 0) {
          e.breathTick = 0.2;
          const d = Math.hypot(pb.center.x - mx, pb.center.y - my);
          let a2 = Math.abs(Math.atan2(pb.center.y - my, pb.center.x - mx) - e.breathA) % (Math.PI * 2); if (a2 > Math.PI) a2 = Math.PI * 2 - a2;
          if (this.state !== 'dead' && d < 140 && a2 < 0.4 && this.los(mx, my, pb.center.x, pb.center.y)) this.hurtPlayer(6, mx, { knock: false, iframes: false });
          for (const o of this.enemies.getChildren()) if (o.alive && o !== e && Math.hypot(o.x - mx, o.y - my) < 120) this.ignite(o, 1);
        }
        if (now >= e.aiUntil) { e.ai = 'walk'; e.atkCd = 2.0 / rage; }
        return;
      }
      case 'slamWind':
        b.velocity.x = 0; e.fr = 'crouch';
        if (now >= e.aiUntil) {
          e.ai = 'air'; b.velocity.y = -430; b.velocity.x = clamp(dx * 1.1, -220, 220); Sfx.whoosh();
          if (dy > 24 && Math.abs(b.velocity.x) < 130) b.velocity.x = (dx >= 0 ? 1 : -1) * 130;   // you're below: leap clear of the ledge
          if (Math.abs(b.velocity.x) < 90) b.velocity.x = (dx >= 0 ? 1 : -1) * 90;
          e.leapVx = b.velocity.x;
        }
        return;
      case 'air':
        e.fr = 'wind';
        if (!onGround) b.velocity.x = e.leapVx;                          // keep the push while scraping up a crate face
        if (onGround && e.airT === 0 && now > e.aiUntil + 200) { e.ai = 'walk'; e.atkCd = 1.8 / rage; }
        return;
      default: {
        e.dir = dx >= 0 ? 1 : -1;
        const ledge = !this.standAt(b.center.x + e.dir * (b.halfWidth + 6), b.bottom + 4), below = dy > 24;
        // drops off ledges after you (the landing slams); only a ledge with you above it stops the walk
        const go = (Math.abs(dx) > 50 || (below && ledge)) && (!ledge || below);
        b.velocity.x = approach(b.velocity.x, go ? e.dir * TUNE.BOSS.speed * rage * (ledge ? 1.6 : 1) : 0, 400 * dt);
        if (onGround && e.atkCd <= 0) {
          e.summonCycle++;
          if (phase === 3 && e.summonCycle % 3 === 0) { this.bossSummon(e); e.atkCd = 1.6; }
          else if (dist < 130 && phase >= 2 && Math.random() < 0.5) { e.ai = 'breathWind'; e.aiUntil = now + 600; }

      for (const [dx, dy] of D4) { const k = (y + dy) * MAP_W + x + dx; if (!seen.has(k) && this.tileAt(x + dx, y + dy) === c) { seen.add(k); q.push([x + dx, y + dy]); } }
    }
    const dist = new Map(), bq = [];
    for (const [x, y] of comp) {
      const k = y * MAP_W + x;
      if (this.anchors.has(k) || D4.some(([dx, dy]) => this.tileAt(x + dx, y + dy) === '#')) { dist.set(k, 0); bq.push([x, y]); }
    }
    for (let i = 0; i < bq.length; i++) {
      const [x, y] = bq[i], d = dist.get(y * MAP_W + x);
      for (const [dx, dy] of D4) { const k = (y + dy) * MAP_W + x + dx; if (seen.has(k) && !dist.has(k)) { dist.set(k, d + 1); bq.push([x + dx, y + dy]); } }
    }
    let n = 0;
    for (const [x, y] of comp) { const d = dist.get(y * MAP_W + x); if (d === undefined || d > TUNE.TILE.span) { this.collapseTile(x, y); n++; } }
    if (n) { Sfx.creak(); this.shake(220, 0.005); if (n >= 3) BUS.emit('callout', 'COLLAPSE!'); }
  }
  collapseTile(tx, ty) {                                               // tears loose and drops as a solid block
    const c = this.tileAt(tx, ty); if (!TILE_HP[c]) return;
    this.destroyTile(tx, ty, false);
    const cx = tx * TS + 8, cy = ty * TS + (c === '=' ? 3 : 8);
    this.fxDust(cx, cy, 3);
    const fb = this.fblocks.getFirstDead(false); if (!fb) return;
    fb.setTexture('fb_' + c).enableBody(true, cx, cy, true, true);
    fb.body.setSize(14, c === '=' ? 5 : 14, true); fb.body.setAllowGravity(true);
    fb.setVelocity(rand(-25, 25), rand(-40, 0)); fb.setRotation(0); fb.body.setAngularVelocity(rand(-140, 140));
    Object.assign(fb, { kind: c, t: 0, hits: new Set(), hitP: false });
  }
  updateFallingBlocks(dt) {
    for (const fb of this.fblockList) {
      if (!fb.active) continue;
      fb.t += dt;
      const vy = fb.body.velocity.y, hh = fb.kind === '=' ? 3 : 7;
      if (vy > 140) {                                                   // anything under it gets flattened
        for (const e of this.enemies.getChildren()) {
          if (!e.alive || fb.hits.has(e) || e.kind === 'boss') continue;
          const eb = e.body;
          if (fb.x + 7 > eb.left && fb.x - 7 < eb.right && fb.y + hh > eb.top && fb.y - hh < eb.bottom) {
            fb.hits.add(e); this.fxBlood(eb.center.x, eb.top, 10, -Math.PI / 2, 1.6, [60, 220]);
            this.damageEnemy(e, 80, 0, 1, 'crush');
            if (!e.alive) { BUS.emit('callout', pick(['CRUSHED!', 'FLATTENED!', 'PANCAKED!'])); this.addStyle(80); }
          }
        }
        const pb = this.player.body;
        if (!fb.hitP && this.state !== 'dead' && fb.x + 7 > pb.left && fb.x - 7 < pb.right && fb.y + hh > pb.top && fb.y - hh < pb.bottom) { fb.hitP = true; this.hurtPlayer(18, fb.x); }
      }
      if ((vy >= 0 && fb.t > 0.05 && this.standAt(fb.x, fb.y + hh + 1)) || fb.t > 4) this.shatterBlock(fb);
    }
  }
  shatterBlock(fb) {
    const x = fb.x, y = fb.y, c = fb.kind, hh = c === '=' ? 3 : 7;
    fb.disableBody(true, true);
    const gibs = c === 'x' ? ['g_plank', 'g_plank2', 'g_plank', 'g_shard'] : c === 'g' ? ['g_beam', 'g_beam', 'g_shard', 'g_shard2'] : ['g_bar', 'g_bar', 'g_shard2'];
    for (let i = 0; i < 6; i++) this.spawnGib(pick(gibs), x + rand(-6, 6), y + rand(-4, 4), rand(-200, 200), rand(-260, -80), 'metal');
    this.fxDust(x, y + hh, 10); this.fxSmoke(x, y, 4, 1); this.fxSparks(x, y + hh, 8, -Math.PI / 2, 2.4, [80, 240]);
    Sfx.smash(c); this.shake(110, 0.005); this.addKick(0, 2);
    this.damageTile(Math.floor(x / TS), Math.floor((y + hh + 1) / TS), 26);   // pancakes into whatever it lands on
    for (const { rd } of this.pushRagdolls(x, y, 26, 300, 160)) this.hitRagdoll(rd, x, y, 30, 0, 1, 'blast');
    for (const e of this.enemies.getChildren()) if (e.alive && Math.abs(e.body.center.x - x) < 16 && Math.abs(e.body.bottom - (y + hh)) < 10) this.damageEnemy(e, 20, Math.sign(e.x - x) || 1, -1, 'crush');
  }

  // ------------------------------------------------------------ enemy rockets & bombs ----
  // Slow enough to read: shoot them down, kick them back, or just get out of the splash.
  spawnEProj(kind, x, y, vx, vy) {
    const p = this.eprojs.getFirstDead(false); if (!p) return null;
    p.setTexture(kind === 'bomb' ? 'ebomb' : 'erocket').enableBody(true, x, y, true, true);
    p.body.setSize(5, 5, true); p.body.setAllowGravity(kind === 'bomb');
    p.setVelocity(vx, vy); p.setRotation(Math.atan2(vy, vx));
    Object.assign(p, { pk: kind, life: kind === 'bomb' ? 4 : 3.5, px: x, py: y });
    p.glow.setVisible(true).setPosition(x, y).setTint(kind === 'bomb' ? 0xff3020 : 0xffa040);
    return p;
  }
  popEProj(p, x = p.x, y = p.y) {
    p.disableBody(true, true); p.glow.setVisible(false);
    this.explode(x, y, p.pk === 'bomb' ? TUNE.WASP.bomb : TUNE.ROCKETEER.blast);
  }
  updateEProjs(dt) {
    const pb = this.player.body;
    for (const p of this.eprojList) {
      if (!p.active) continue;
      p.life -= dt;
      const hit = this.sweep(p.px, p.py, p.x, p.y);
      const onP = this.state !== 'dead' && p.x > pb.left - 3 && p.x < pb.right + 3 && p.y > pb.top - 3 && p.y < pb.bottom + 3;
      const landed = p.pk === 'bomb' && p.body.velocity.y > 0 && this.standAt(p.x, p.y + 3);   // gratings catch bombs too
      if (hit || onP || landed || p.life <= 0) { this.popEProj(p, hit ? hit.x : p.x, hit ? hit.y : p.y); continue; }
      let shot = null;
      for (const b of this.bulletList) if (b.active && Math.abs(b.x - p.x) < 7 && Math.abs(b.y - p.y) < 7) { shot = b; break; }
      if (shot) { shot.disableBody(true, true); this.popEProj(p); BUS.emit('callout', 'SHOT DOWN'); this.addStyle(40); continue; }
      const a = Math.atan2(p.body.velocity.y, p.body.velocity.x);
      p.setRotation(a);
      if (p.pk === 'rocket') {
        const tx = p.x - Math.cos(a) * 5, ty = p.y - Math.sin(a) * 5;
        this.fx.emit(tx, ty, { n: 1, speed: [5, 20], life: [0.4, 0.8], size: [2, 5], cols: [0x8a8580, 0x5a5652, 0x3a3836], alpha: [0.5, 0], g: -25, drag: 2, jitter: 1 });
        this.fx.emit(tx, ty, { n: 1, angle: a + Math.PI, spread: 0.6, speed: [20, 60], life: [0.08, 0.16], size: [3, 1], cols: [0xffffff, 0xffe46a, 0xff8a1f], add: true });
      } else if (Math.random() < 0.5) this.fx.emit(p.x, p.y - 3, { n: 1, speed: [0, 8], life: [0.1, 0.2], size: [2, 1], cols: [0xffe46a, 0xff5a1a], add: true });
      p.px = p.x; p.py = p.y;
    }
  }

  // ------------------------------------------------------------------ rocketeer ----
  // Humanoid with a launcher: keeps its distance, 0.75 s orange laser tell, slow rocket aimed at your feet.
  thinkRocketeer(e, dt, now, c) {
    const T = TUNE.ROCKETEER;
    e.fireCd -= dt; e.repickT -= dt;
    switch (e.ai) {
      case 'idle': this.lookAround(e, dt); return 'hold';
      case 'dodge': if (c.onGround && now > e.aiUntil + 120) { e.ai = 'engage'; e.repickT = 0; } return 'free';
      case 'aim': {
        const k = (now - e.aimStart) / T.aimMs;
        if (k < T.lockAt) e.aimA = this.rocketAim(e);
        if (!c.canSee && k < 0.4) { e.ai = 'engage'; e.fireCd = 0.6; return 'hold'; }
        if (now >= e.aiUntil) { this.rocketeerShoot(e); e.fireCd = T.fireCd * rand(0.85, 1.15); e.ai = 'engage'; e.repickT = Math.random() < 0.5 ? 0 : 1.2; }
        return 'hold';
      }
      case 'retreat': if (now > e.aiUntil) { e.ai = 'engage'; e.repickT = 0; } return 'path';
      case 'search':
        if (c.canSee || now - e.lkT < 300) { e.ai = 'engage'; e.repickT = 0; return 'path'; }
        if (now > e.searchUntil || !c.alive) { e.ai = 'idle'; e.aggro = false; return 'hold'; }
        if (!e.path || e.pathI >= e.path.length) { this.lookAround(e, dt, 2.5); return 'hold'; }
        return 'path';
      default: {
        if (!c.alive) { e.ai = 'idle'; e.aggro = false; return 'hold'; }
        if (now - e.lkT > 1800) { e.ai = 'search'; e.searchUntil = now + 6000; this.pathTo(e, navBelow(e.lkx, e.lky - 4), 160); return 'path'; }
        if (c.dist < 80 && c.onGround && !e.navAir && e.repickT < 1.5) { e.repickT = 2; e.ai = 'retreat'; e.aiUntil = now + 1400; this.pickPosition(e, 'retreat'); return 'path'; }
        if (c.onGround && !e.navAir && e.repickT <= 0) { e.repickT = rand(3, 4.5); if (!this.pickPosition(e, 'attack')) this.pathTo(e, navBelow(e.lkx, e.lky - 4), 160); }
        if (c.canSee && c.onGround && !e.navAir && e.fireCd <= 0 && c.dist < 340 && c.dist > 60) {
          e.ai = 'aim'; e.aimStart = now; e.aiUntil = now + T.aimMs; e.aimA = this.rocketAim(e); Sfx.charge(0.6); return 'hold';
        }
        return 'path';
      }
    }
  }
  rocketAim(e) {                                                       // aims at your feet so near misses still splash
    const pb = this.player.body, sx = e.x, sy = e.y - 2, tof = Math.hypot(pb.center.x - sx, pb.bottom - sy) / TUNE.ROCKETEER.rocketSpeed;
    return Math.atan2(pb.bottom - 3 - sy + (pb.blocked.down ? 0 : pb.velocity.y * tof * 0.2), pb.center.x + pb.velocity.x * tof * 0.5 - sx);
  }
  rocketeerShoot(e) {
    const T = TUNE.ROCKETEER, sx = e.x + (e.dir > 0 ? 0 : -1), sy = e.y - 2, a = e.aimA + rand(-2, 2) * DEG;
    const mx = sx + Math.cos(a) * 22, my = sy + Math.sin(a) * 22;
    e.recoil = 5; e.body.velocity.x -= Math.cos(a) * 60;
    Sfx.rocket(); this.spawnLight(mx, my, 'glow', 0xffa040, 1, 1.8, 0.9, 0.12);
    this.fxSmoke(sx - Math.cos(a) * 8, sy - Math.sin(a) * 8, 6); this.fxFire(mx, my, 4);
    if (this.solidAt(mx, my) || !this.los(sx, sy, mx, my)) return;
    this.spawnEProj('rocket', mx, my, Math.cos(a) * T.rocketSpeed, Math.sin(a) * T.rocketSpeed);
  }

  // ---------------------------------------------------------------------- wasp ----
  // Bomber drone: climbs to a perch well above your head, then makes straight bomb runs over you
  // (blinking bomb sight, 3 bombs) and peels away to line up the next one.
  updateWasp(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, T = TUNE.WASP, pb = this.player.body;
    if (alive && !e.aggro && (e.sees || dist < 140) && dist < e.def.sight) { this.alertEnemy(e, now); Sfx.chirp(); }
    if (e.aggro && e.sees) e.aggroT = Math.max(e.aggroT, 4);
    if (e.aggro && (e.aggroT <= 0 || !alive)) { e.aggro = false; e.ai = 'patrol'; }
    let tx, ty, spd = T.speed;
    if (e.ai === 'run' && alive) {
      tx = e.x + e.runDir * 200; ty = e.runY; spd = T.speed * 1.5;
      e.bombT -= dt;
      if (e.bombT <= 0 && e.bombs > 0 && Math.abs(e.x - pb.center.x) < 64) { e.bombT = T.bombGap; e.bombs--; this.waspDrop(e); }
      const passed = e.runDir > 0 ? e.x > pb.center.x + 110 : e.x < pb.center.x - 110, walled = e.runDir > 0 ? b.blocked.right : b.blocked.left;
      if (now > e.aiUntil || walled || (passed && e.bombs < T.runBombs)) { e.ai = 'rest'; e.aiUntil = now + T.rest * 1000; e.runEnd = now; }
    } else if (e.aggro && alive) {
      const side = e.x < pb.center.x ? -1 : 1, rest = e.ai === 'rest' && now < e.aiUntil;
      tx = pb.center.x + side * (rest ? 140 : 95);
      for (const o of this.enemies.getChildren()) if (o !== e && o.alive && o.kind === 'wasp' && Math.abs(o.x - e.x) < 30 && Math.abs(o.y - e.y) < 24) tx += e.x <= o.x ? -45 : 45;   // don't stack up
      if ((e.altT = (e.altT || 0) - dt) <= 0) { e.altT = 0.3; e.alt = this.waspAlt(pb, pb.center.x); }
      ty = e.alt + Math.sin(e.t * 2) * 6;
      if (!rest) {
        e.ai = 'stalk';
        if (Math.abs(e.y - ty) < 20 && Math.abs(e.x - tx) < 40 && now - (e.runEnd || 0) > 600) { e.ai = 'run'; e.runDir = -side; e.runY = e.alt; e.bombs = T.runBombs; e.bombT = 0.1; e.aiUntil = now + 3200; Sfx.chirp(); }
      }
    } else { tx = e.homeX + Math.sin(e.t * 0.5) * 60; ty = e.homeY + Math.sin(e.t * 1.3) * 10; }
    if (e.stunT <= 0) {
      const k = Math.min(1, dt * 3);
      b.velocity.x += (clamp((tx - b.center.x) * 2.2, -spd, spd) - b.velocity.x) * k;
      b.velocity.y += (clamp((ty - b.center.y) * 2.2, -spd * 0.8, spd * 0.8) - b.velocity.y) * k;
    } else { const f = Math.pow(0.05, dt); b.velocity.x *= f; b.velocity.y *= f; }
    if (Math.abs(b.velocity.x) > 8) e.dir = b.velocity.x > 0 ? 1 : -1;
    e.fr = e.ai === 'run' && e.bombs > 0 ? 'pb' : Math.floor(e.t * 18) % 2 ? 'p1' : 'p0';
  }
  waspAlt(pb, x) {                                                     // highest clear flight lane 45-95 px over your head
    for (const off of [92, 80, 68, 56, 44]) {
      const y = pb.top - off; let clear = true;
      for (let xx = x - 150; xx <= x + 150 && clear; xx += 10) if (this.solidAt(xx, y - 7) || this.solidAt(xx, y + 7)) clear = false;
      if (clear) return y;
    }
    return pb.top - 36;
  }
  waspDrop(e) {
    const b = e.body;
    this.spawnEProj('bomb', e.x, b.bottom + 3, b.velocity.x * 0.6, 30);
    Sfx.whistle(); Sfx.clunk(0.6);
  }

  // -------------------------------------------------------------------- rammer ----
  // Armoured charger: snorts and scrapes (0.65 s), then bulldozes in a straight line, smashing crates and
  // girders and trampling its own side. Its ram plate shrugs off frontal fire; slam it into solid metal
  // and it's dizzy - and takes double damage - for a moment.
  updateRammer(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, D = e.def, T = TUNE.RAMMER, onGround = b.blocked.down || b.touching.down, adx = Math.abs(dx), pb = this.player.body;
    const sees = e.sees || (alive && adx < D.sight && Math.abs(dy) < 40 && this.losHard(b.center.x, b.center.y - 3, pb.center.x, pb.center.y - 4));   // crates don't hide you from it
    if (alive && !e.aggro && sees && adx < D.sight && Math.abs(dy) < 80) this.alertEnemy(e, now);
    if (e.aggro && sees) e.aggroT = Math.max(e.aggroT, 4);
    if (e.aggro && (e.aggroT <= 0 || !alive) && e.ai !== 'charge') { e.aggro = false; e.ai = 'patrol'; }
    e.atkCd -= dt;
    let fr = null;
    if (e.ai === 'wind') {
      b.velocity.x = 0; fr = 'wind';
      if (Math.random() < 0.4) this.fxDust(b.center.x - e.dir * 8, b.bottom, 1);
      if (now >= e.aiUntil) { e.ai = 'charge'; e.aiUntil = now + T.chargeT * 1000; e.hitSet = new Set(); Sfx.growl(true); this.shake(120, 0.004); }
    } else if (e.ai === 'charge') {
      b.velocity.x = e.dir * T.speed; fr = Math.floor(now / 70) % 2 ? 'c0' : 'c1';
      if (Math.random() < 0.6) this.fxDust(b.center.x - e.dir * 10, b.bottom, 1);
      if (Math.floor(now / 140) !== e.stepK) { e.stepK = Math.floor(now / 140); Sfx.land(0.5); this.shake(50, 0.002); }
      const fx = e.dir > 0 ? b.right + 2 : b.left - 2;
      for (let yy = b.top + 2; yy < b.bottom - 1; yy += 6) {                // bulldozes breakables
        const tx = Math.floor(fx / TS), ty = Math.floor(yy / TS), ch = this.tileAt(tx, ty);
        if (ch === 'x' || ch === 'g') { this.destroyTile(tx, ty, true); this.addKick(e.dir * 2, 0); }
      }
      for (const o of this.enemies.getChildren()) {                       // ...and its own side
        if (o === e || !o.alive || e.hitSet.has(o) || o.kind === 'boss') continue;
        const ob = o.body; if (ob.right < b.left - 2 || ob.left > b.right + 2 || ob.bottom < b.top || ob.top > b.bottom) continue;
        e.hitSet.add(o); const k = Math.max(0.3, o.def.kb);
        o.body.velocity.x = e.dir * 380 * k; o.body.velocity.y = -260 * k; o.kickedT = 0.6;
        this.damageEnemy(o, 40, e.dir, -0.5, 'kick'); Sfx.kickHit();
      }
      if (alive && !e.hitP && pb.right > b.left - 2 && pb.left < b.right + 2 && pb.bottom > b.top && pb.top < b.bottom) {
        e.hitP = true;
        if (this.hurtPlayer(T.dmg, b.center.x)) { pb.velocity.x = e.dir * 420; pb.velocity.y = -260; this.shake(200, 0.012); this.addKick(e.dir * 8, -3); Sfx.kickHit(); }
      }
      if ((e.dir > 0 ? b.blocked.right : b.blocked.left) && (this.solidAt(fx, b.center.y) || this.solidAt(fx, b.bottom - 4))) {   // hit solid metal: seeing stars
        e.ai = 'dizzy'; e.aiUntil = now + T.stun * 1000; b.velocity.x = -e.dir * 120; b.velocity.y = -150;
        this.shake(300, 0.012); Sfx.stomp(); Sfx.clang(); this.fxSparks(fx, b.center.y, 14, e.dir > 0 ? Math.PI : 0, 1.4, [80, 260]);
        this.blastTiles(fx + e.dir * 6, b.center.y, 20, 60);
        if (Math.hypot(this.player.x - e.x, this.player.y - e.y) < 320) BUS.emit('callout', 'BONK!');
      } else if (now >= e.aiUntil) { e.ai = 'skid'; e.aiUntil = now + 450; }
    } else if (e.ai === 'skid') {
      b.velocity.x = approach(b.velocity.x, 0, 900 * dt); fr = 'w0';
      if (Math.random() < 0.8) this.fxDust(b.center.x + e.dir * 8, b.bottom, 1);
      if (now >= e.aiUntil) { e.ai = 'chase'; e.atkCd = T.cd; }
    } else if (e.ai === 'dizzy') {
      if (onGround) b.velocity.x = approach(b.velocity.x, 0, 600 * dt); fr = 'dz';
      if (Math.random() < 0.6) this.fx.emit(b.center.x + Math.cos(now / 110) * 9, b.top - 3 + Math.sin(now / 110) * 2, { n: 1, speed: [0, 5], life: [0.2, 0.3], size: [2, 1], cols: [0xffe14a, 0xffffff], add: true });
      if (now >= e.aiUntil) { e.ai = 'chase'; e.atkCd = T.cd * 0.6; }
    } else if (e.aggro && alive) {
      e.ai = 'chase'; e.dir = dx > 0 ? 1 : -1;
      const ground = this.standAt(b.center.x + e.dir * (b.halfWidth + 4), b.bottom + 4);
      b.velocity.x = approach(b.velocity.x, (ground || dy > 20) && adx > 10 ? e.dir * D.chase : 0, 500 * dt);
      if (onGround && e.atkCd <= 0 && sees && adx < 300 && adx > 40 && Math.abs(dy) < 36) { e.ai = 'wind'; e.aiUntil = now + T.windMs; e.hitP = false; Sfx.snort(); this.popAlert(e); }
    } else {
      if (onGround) { const ground = this.standAt(b.center.x + e.dir * (b.halfWidth + 4), b.bottom + 4), wall = e.dir > 0 ? b.blocked.right : b.blocked.left; if (!ground || wall) e.dir *= -1; }
      b.velocity.x = approach(b.velocity.x, e.dir * D.patrol, 400 * dt);
    }
    if (!fr) { const moving = Math.abs(b.velocity.x) > 6 && onGround; if (moving) e.animT += dt * Math.abs(b.velocity.x) / 16; fr = 'w' + (moving ? Math.floor(e.animT) % 4 : 0); }
    e.fr = fr;
  }

  // ------------------------------------------------------------- cluster mortar ----
  clusterBurst(x, y, vx, vy) {                                          // airburst: scatters bomblets over everything below
    const C = TUNE.CLUSTER;
    this.explode(x, y, C.shell); Sfx.clusterPop();
    for (let i = 0; i < C.bomblets; i++) {
      const b = this.spawnGrenade(x, y, 0, 'bomb'); if (!b) break;
      b.setVelocity(vx * 0.6 + Math.sign(vx || 1) * rand(-50, 170), Math.min(vy * 0.3, 60) + rand(-200, -40));   // mostly forward, not back on you
    }
  }
  // -------------------------------------------------------------- stake driver ----
  // A heavy stake: kills that leave a body carry it (up to 2) and nail it to the next wall; tough targets
  // just eat it. Pinned bodies dangle from the wall until they're blown apart or the wall breaks.
  spawnStake(x, y, a) {
    const s = this.stakes.getFirstDead(false); if (!s) return;
    const W = TUNE.STAKE;
    s.enableBody(true, x, y, true, true); s.body.setAllowGravity(false); s.body.setSize(4, 4, true);
    s.setVelocity(Math.cos(a) * W.speed, Math.sin(a) * W.speed); s.setRotation(a);
    Object.assign(s, { life: W.life, px: x, py: y, carry: [], hits: new Set() });
  }
  updateStakes(dt) {
    const W = TUNE.STAKE;
    for (const s of this.stakeList) {
      if (!s.active) continue;

  // ----------------------------------------------------------------- jet trooper ----
  // Hovers off your shoulder on a jetpack, swaps sides every few seconds, 0.35 s glint then a 4-round burst.

    const b = e.body, T = TUNE.JET, pb = this.player.body;
    if (alive && !e.aggro && (e.sees || dist < 120) && dist < e.def.sight) { this.alertEnemy(e, now); Sfx.chirp(); }
    if (e.aggro && e.sees) e.aggroT = Math.max(e.aggroT, 4);

      tx = pb.center.x + e.side * T.range + Math.sin(e.t * 1.7) * 30;
      ty = pb.top - T.height + Math.sin(e.t * 2.3) * 14;
      for (let i = 0; i < 5 && this.solidAt(tx, ty); i++) { tx += (pb.center.x - tx) * 0.3; ty += 10; }
      if (e.ai !== 'burst') e.aimA = Math.atan2(pb.center.y - e.y, pb.center.x - e.x);

      if (Math.abs(b.velocity.x) > 8) e.dir = b.velocity.x > 0 ? 1 : -1;

    }

      b.velocity.y += (clamp((ty - b.center.y) * 2, -T.speed * 0.8, T.speed * 0.8) - b.velocity.y) * k;
    } else b.velocity.y += 300 * dt;                                      // stunned: loses thrust and drops

    else if (e.ai === 'burst') {

    if (Math.random() < 0.8) this.fx.emit(e.x - e.dir * 4, e.y + 9, { n: 1, angle: Math.PI / 2, spread: 0.4, speed: [60, 130], life: [0.08, 0.18], size: [3, 1], cols: [0xffffff, 0x9adcff, 0x4a8aff], add: true });

    e.recoil = Math.max(0, e.recoil - 30 * dt);

  // ---------------------------------------------------------------- brood mother ----
  // Slow, fat, and full of ticks: swells up (0.7 s) and births a pair every few seconds; bursts into more.

    const b = e.body, D = e.def, T = TUNE.BROOD, onGround = b.blocked.down || b.touching.down;
    if (alive && !e.aggro && (e.sees || dist < 160) && dist < D.sight) this.alertEnemy(e, now);
    if (e.aggro && e.sees) e.aggroT = Math.max(e.aggroT, 5);
    if (e.aggro && (e.aggroT <= 0 || !alive)) e.aggro = false;
    e.atkCd -= dt;
    if (e.ai === 'birth') {
      b.velocity.x = approach(b.velocity.x, 0, 300 * dt);
      e.fr = 1 - (e.aiUntil - now) / T.tellMs > 0.55 ? 'sw2' : 'sw';
      if (Math.random() < 0.3) this.fxBlood(e.x + rand(-8, 8), b.top + 4, 1, -Math.PI / 2, 1, [20, 60]);
      if (now >= e.aiUntil) { this.broodBirth(e.x, e.body.top + 8, e.dir, T.spawn, e); e.ai = 'crawl'; e.atkCd = T.cd; }

      b.velocity.x = approach(b.velocity.x, ground && Math.abs(dx) > 30 ? e.dir * T.speed : 0, 200 * dt);
      const mine = this.enemies.getChildren().filter(o => o.alive && o.mother === e).length;

  broodBirth(x, y, dir, n, mother) {

  // ------------------------------------------------------------- props: lamps & gas ----

  spawnCanisters(fx) {

  }
  igniteCanister(k, heading) {                                          // valve shears off: it becomes a very bad rocket

  updateCanisters(dt) {

      k.t -= dt; k.heading += rand(-5, 5) * dt;

      if ((b.blocked.left && hc < 0) || (b.blocked.right && hc > 0)) { k.heading = Math.PI - k.heading; Sfx.clunk(); this.fxSparks(k.x, k.y, 4); }
      if ((b.blocked.up && hs < 0) || (b.blocked.down && hs > 0)) { k.heading = -k.heading; Sfx.clunk(); this.fxSparks(k.x, k.y, 4); }

      }

  // ---------------------------------------------------------------- cryo cannon ----
  // A freezing spray: chill slows enemies, full chill turns them into ice statues for a few seconds. A statue

  fireCryo(now, ox, oy, a) {
    const W = TUNE.CRYO, sx = this.shoulder.x, sy = this.shoulder.y;
    this.cryoActiveUntil = now + 110; this.stats.shots++; this.recoil = 1;
    for (let i = 0; i < 3; i++) this.fx.emit(ox, oy, { n: 1, angle: a, spread: W.cone * 2 * DEG, speed: [150, 230], life: [0.25, 0.45], size: [2, 6], cols: [0xffffff, 0xe0f8ff, 0x9adcff, 0x5aa8e0], add: true, drag: 1.6, g: 20 });
    this.fx.emit(ox, oy, { n: 1, angle: a, spread: 0.4, speed: [60, 120], life: [0.6, 1], size: [3, 8], cols: [0xd8f0ff, 0xa0c8e0], alpha: [0.3, 0], g: 10, drag: 1.2 });
    if (Math.random() < 0.4) this.spawnLight(ox + Math.cos(a) * 30, oy + Math.sin(a) * 30, 'glow', 0x80d0ff, 1.8, 2.4, 0.35, 0.1);
    const inCone = (x, y, extra) => {

  }
  updateFrozen(e, dt) {                                                 // ice statue: no brain, slides, shatters on a hard landing

  // --------------------------------------------------------------------- sentry ----
  // T: drops an auto-turret at your feet. It hunts the nearest visible enemy with rivets for 14 s (enemy blasts
  // can wreck it early), then pops. 12 s recharge after it's gone.
  deploySentry(now) {
    if (this.sentry || now < this.sentryReadyAt || this.state === 'dead') return;
    const T = TUNE.SENTRY, p = this.player, x = p.x + this.facing * 10;
    let fy = p.body.bottom; for (let i = 0; i < 60 && !this.standAt(x, fy + 1); i++) fy += 2;
    const base = this.add.image(x, fy - 5, 'sentry_base').setDepth(5.6), head = this.add.image(x, fy - 12, 'sentry_head').setOrigin(5 / 16, 0.5).setDepth(5.7);
    const glow = this.add.image(x, fy - 12, 'glow').setBlendMode(ADD).setTint(0x46e6ff).setScale(0.4).setAlpha(0.7).setDepth(18);
    this.sentry = { x, y: fy, base, head, glow, t: T.life, hp: T.hp, cd: 0.4, aim: this.facing > 0 ? 0 : Math.PI, target: null, vy: 0, beepT: 0, retarget: 0, recoil: 0 };
    Sfx.clunk(); Sfx.mineArm(); this.fxDust(x, fy, 6); BUS.emit('callout', 'SENTRY UP');
  }
  updateSentry(dt, now) {
    const S = this.sentry, T = TUNE.SENTRY; if (!S) return;
    S.t -= dt;
    if (!this.standAt(S.x, S.y + 1)) { S.vy += this.physics.world.gravity.y * dt; S.y += S.vy * dt; if (S.y > LH) S.t = 0; }   // its floor got blown away
    else if (S.vy) { S.y = Math.floor((S.y + 1) / TS) * TS; S.vy = 0; Sfx.clunk(); }
    const hx = S.x, hy = S.y - 12;
    S.retarget -= dt;
    if (S.retarget <= 0 || !S.target || !S.target.alive) {
      S.retarget = 0.25; S.target = null; let bd = T.range;
      for (const e of this.enemies.getChildren()) {
        if (!e.alive) continue;
        const d = Math.hypot(e.body.center.x - hx, e.body.center.y - hy);
        if (d < bd && this.los(hx, hy, e.body.center.x, e.body.center.y)) { bd = d; S.target = e; }
      }
    }
    const want = S.target ? Math.atan2(S.target.body.center.y - hy, S.target.body.center.x - hx) : S.aim + Math.sin(now / 500) * 0.03;
    let da = want - S.aim; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;

      const ca = Math.cos(S.aim), sa = Math.sin(S.aim), mx = hx + ca * 11, my = hy + sa * 11;
      this.spawnBullet('rivet', mx, my, S.aim + rand(-2, 2) * DEG, 560, T.damage, 0.6);
      this.spawnLight(mx, my, 'glow', 0xffd080, 0.6, 1, 0.9, 0.05); Sfx.rivet(); S.recoil = 2;
      if (Math.random() < 0.5) this.spawnGib('g_casing', hx, hy - 1, rand(-60, 60), rand(-160, -100), 'shell');
    }
    S.recoil = Math.max(0, S.recoil - 30 * dt);
    S.base.setPosition(S.x, S.y - 5);
    S.head.setPosition(hx - Math.cos(S.aim) * S.recoil, hy - Math.sin(S.aim) * S.recoil).setRotation(S.aim); S.head.scaleY = Math.cos(S.aim) < 0 ? -1 : 1;
    const low = S.t < 2.5 && Math.floor(now / 120) % 2;

  }

  // ------------------------------------------------------------------- screamer ----
  // Flaming kamikaze skulls: hover off to one side, shriek (0.5 s), then dive at you and blow. Killing one in
  // the air still sets it off; frozen ones just shatter.
  updateScreamer(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, T = TUNE.SCREAMER, pb = this.player.body;
    if (alive && !e.aggro && (e.sees || dist < 150) && dist < e.def.sight) { e.aggro = true; e.aggroT = 6; this.popAlert(e); }
    if (e.ai === 'dive') {
      const want = Math.atan2(pb.center.y - e.y, pb.center.x - e.x);
      let da = want - e.head; while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
      e.head += clamp(da, -T.turn * dt, T.turn * dt);
      e.spd = Math.min(T.speed * 1.2, e.spd + 220 * dt);
      b.velocity.x = Math.cos(e.head) * e.spd; b.velocity.y = Math.sin(e.head) * e.spd;
      e.dir = b.velocity.x >= 0 ? 1 : -1; e.rotation = e.dir > 0 ? e.head : e.head - Math.PI;
      this.fx.emit(e.x - Math.cos(e.head) * 6, e.y - Math.sin(e.head) * 6, { n: 2, angle: e.head + Math.PI, spread: 0.5, speed: [30, 90], life: [0.12, 0.3], size: [4, 1], cols: [0xffffff, 0xffe46a, 0xff8a1f, 0xc03010], add: true });
      if ((alive && dist < 12) || b.blocked.left || b.blocked.right || b.blocked.up || b.blocked.down || now > e.aiUntil) { this.screamerBoom(e); return; }

      e.rotation = rand(-0.15, 0.15); e.fr = 'sw';
      if (now >= e.aiUntil) { e.ai = 'dive'; e.head = Math.atan2(pb.center.y - e.y, pb.center.x - e.x); e.spd = T.speed * 0.7; e.aiUntil = now + 2600; }
      return;
    }
    let tx = e.homeX + Math.sin(e.t * 0.8) * 30, ty = e.homeY + Math.sin(e.t * 1.9) * 8;
    if (e.aggro && alive) {
      tx = pb.center.x + (e.x < pb.center.x ? -110 : 110) + Math.sin(e.t * 2.3) * 20; ty = pb.top - 50 + Math.sin(e.t * 3) * 10; e.dir = dx >= 0 ? 1 : -1;

  }
  screamerBoom(e) { const x = e.x, y = e.y; e.hp = 0; this.killEnemy(e, 0, 0, 'tickboom'); this.explode(x, y, TUNE.SCREAMER.boom); }

  // --------------------------------------------------------------------- warden ----
  // Shield drone: links to the 2 nearest allies and soaks 75% of what hits them (bubble + tether). Kill it first.
  updateWarden(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, T = TUNE.WARDEN, pb = this.player.body;
    if (alive && !e.aggro && (e.sees || dist < 150) && dist < e.def.sight) this.alertEnemy(e, now);
    e.linkT -= dt;
    if (e.linkT <= 0) {
      e.linkT = 0.4;
      e.links = this.enemies.getChildren().filter(o => o.alive && o !== e && !['warden', 'boss', 'tick', 'screamer'].includes(o.kind) && Math.hypot(o.x - e.x, o.y - e.y) < T.range * 1.6)
        .sort((p, q) => Math.hypot(p.x - e.x, p.y - e.y) - Math.hypot(q.x - e.x, q.y - e.y)).slice(0, T.links);
    }

    let tx = e.homeX, ty = e.homeY;

  // ------------------------------------------------------------------ juggernaut ----

    this.hp = this.dispHp = d.hp; this.lblHp.setStyle({ color: '#ffffff' }).setText(String(d.hp));
    this.applyWeapon(d.weapon); this.count = d.enemies; this.lblCount.setText(String(d.enemies));
    this.setOverlay(false); this.tweens.killTweensOf(this.call); this.call.setAlpha(0);
    this.t0 = this.time.now; this.hurtA = 0; this.healA = 0; this.flashA = 0; this.hmT = 0; this.splats = [];
    this.tweens.killTweensOf(this.lblCombo); this.lblCombo.setAlpha(0);
  }
  onHp(hp, dmg) {
    if (hp < this.hp) { this.hurtA = Math.min(1, this.hurtA + 0.45 + dmg / 40); this.panelShake = 0.25; } else if (hp > this.hp) this.healA = 1;
    this.hp = hp;
    this.lblHp.setStyle({ color: hp > 60 ? '#ffffff' : hp > 30 ? '#ffc23a' : '#ff4a3a' }).setText(String(Math.ceil(hp)));
  }
  onAim(m) { this.aimMode = m; }
  onCount(n) { this.count = n; this.lblCount.setText(String(n)); this.countPulse = 0.25; }
  applyWeapon(i) {
    this.weapon = i;
    this.lblWeapon.setText(WEAPONS[i].name);
    this.slotIcons.forEach((ic, j) => ic.setAlpha(j === i ? 1 : 0.4));
  }
  callout(txt) {
    if (this.overOn) return;
    this.tweens.killTweensOf(this.call);
    this.call.setText(txt).setAlpha(1).setScale(7);
    this.tweens.add({ targets: this.call, scale: 5, duration: 160, ease: 'Back.easeOut' });
    this.tweens.add({ targets: this.call, alpha: 0, delay: 1100, duration: 400 });
  }
  showOver(d) {
    this.tweens.killTweensOf(this.call); this.call.setAlpha(0);
    this.ovTitle.setStyle({ rows: d.won ? WIN_ROWS : LOSE_ROWS }).setText(d.won ? 'ARENA CLEARED' : 'YOU GOT GIBBED');
    this.ovStat1.setText(`TIME ${d.time.toFixed(1)}S    KILLS ${d.kills}/${d.total}`);
    this.ovStat2.setText(`SHOTS ${d.shots}   ACCURACY ${d.acc}%   BEST COMBO X${d.combo}`);
    this.ovStat3.setText(`HEADSHOTS ${d.headshots}    BEST STYLE ${d.style}`);
    this.setOverlay(true);
  }
  setOverlay(on) {
    this.overOn = on;
    const g = this.ovG; g.clear();
    if (on) {
      g.fillStyle(0x000000, 0.66); g.fillRect(0, 168, VIEW_W, 226);
      g.fillStyle(0xff8a1f, 1); g.fillRect(0, 168, VIEW_W, 2); g.fillRect(0, 392, VIEW_W, 2);
    }
    [this.ovTitle, this.ovStat1, this.ovStat2, this.ovStat3, this.ovPrompt, this.ovSub].forEach(o => o.setVisible(on));
  }
  update(time, delta) {
    const dt = Math.min(delta, 50) / 1000;
    const gsr = this.scene.get('Game');
    if (gsr && gsr.sys.isActive()) {                                     // sentry status + rampage timer, read from the game
      const st = gsr.sentry ? 'T SENTRY ' + Math.ceil(gsr.sentry.t) + 'S' : gsr.time.now >= gsr.sentryReadyAt ? 'T SENTRY READY' : 'T SENTRY ' + Math.ceil((gsr.sentryReadyAt - gsr.time.now) / 1000);
      if (st !== this.sentTxt) { this.sentTxt = st; this.lblSentry.setStyle({ color: gsr.sentry ? '#46e6ff' : st.endsWith('READY') ? '#5cff7a' : '#7d8896' }).setText(st); }
      this.rampA = Math.max(0, (gsr.rampageUntil || 0) - gsr.time.now);
    } else this.rampA = 0;
    this.lblRamp.setVisible(this.rampA > 0).setAlpha(Math.floor(time / 150) % 2 ? 1 : 0.55);
    this.dispHp = this.dispHp > this.hp ? Math.max(this.hp, this.dispHp - 30 * dt) : this.hp;
    this.hurtA = Math.max(0, this.hurtA - dt * 1.8); this.healA = Math.max(0, this.healA - dt * 2);
    this.flashA = Math.max(0, this.flashA - dt * 2.2); this.panelShake = Math.max(0, this.panelShake - dt);
    this.draw(time);
    this.drawSplats(dt);
    this.drawBoss(dt);
    // hit marker: four ticks round the crosshair; red + wider on a kill, yellow ring on a headshot
    const hg = this.hmG; hg.clear();
    if (this.hmT > 0 && this.aimMode === 'mouse') {
      this.hmT -= dt;
      const p = this.input.activePointer, cx = Math.round(p.x), cy = Math.round(p.y), grow = this.hmKill ? 5 : 2;
      const col = this.hmHead ? 0xffe14a : this.hmKill ? 0xff3a2a : 0xffffff;
      for (const [c, o] of [[0x000000, 1], [col, 0]]) {
        hg.fillStyle(c, 1);
        for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) for (let i = 0; i < 3; i++) {
          const d = 9 + i * 2 + grow; hg.fillRect(cx + sx * d - 1 + o, cy + sy * d - 1 + o, 2, 2);
        }
      }
      if (this.hmHead) { hg.lineStyle(2, 0xffe14a, Math.min(1, this.hmT * 4)); hg.strokeCircle(cx, cy, 20 + (0.32 - this.hmT) * 30); }
    } else { this.hmT = Math.max(0, this.hmT - dt); }
    if (this.hmT <= 0) this.hmHead = false;
    // style rank: read straight from the game scene
    const gs = this.scene.get('Game'), st = gs && gs.style;
    if (st) {
      const r = st.rank, R = STYLE_RANKS[r];
      if (r !== this.shownRank) { this.shownRank = r; this.lblRank.setStyle({ color: R.c }).setText(R.n); }
      this.styleA += ((st.pts > 4 ? 1 : 0) - this.styleA) * Math.min(1, dt * 5);
      this.rankPop = Math.max(0, this.rankPop - dt);
      this.lblRank.setAlpha(this.styleA).setScale(6 + this.rankPop * 10); this.lblStyleT.setAlpha(this.styleA * 0.9);
      this.styleFrac = r + 1 < STYLE_RANKS.length ? clamp((st.pts - R.t) / (STYLE_RANKS[r + 1].t - R.t), 0, 1) : 1;
    }
    const age = (time - this.t0) / 1000, ha = age < 10 ? 0.9 : Math.max(0.3, 0.9 - (age - 10) * 0.3);
    this.hint1.setAlpha(ha); this.hint2.setAlpha(ha);
    const p = this.input.activePointer;
    this.xhair.setVisible(this.aimMode === 'mouse').setPosition(Math.round(p.x), Math.round(p.y));
    if (this.overOn) this.ovPrompt.setAlpha(Math.floor(time / 400) % 2 ? 1 : 0.35);
    if (this.countPulse > 0) { this.countPulse -= dt; this.lblCount.setScale(4 + Math.max(0, this.countPulse) * 6); }
  }
  drawBoss(dt) {
    const lg = this.lbG; lg.clear();
    if (this.lbT > 0) {                                                 // cinematic bars + title card
      this.lbT -= dt;
      const k = clamp(Math.min((2.8 - this.lbT) / 0.35, this.lbT / 0.35), 0, 1), h = Math.round(64 * k);
      lg.fillStyle(0x000000, 1); lg.fillRect(0, 0, VIEW_W, h); lg.fillRect(0, VIEW_H - h, VIEW_W, h);
      const ta = clamp(Math.min((2.8 - this.lbT - 0.3) / 0.3, this.lbT / 0.4), 0, 1);
      this.lbTitle.setVisible(ta > 0).setAlpha(ta).setScale(8 + (1 - ta) * 3); this.lbSub.setVisible(ta > 0).setAlpha(ta);
    } else { this.lbTitle.setVisible(false); this.lbSub.setVisible(false); }
    const gs = this.scene.get('Game'), b = gs && gs.boss;
    if (b && b.alive && this.lbT < 2.2) {                                // boss health bar, white trail on damage, phase notches
      const frac = clamp(b.hp / b.def.hp, 0, 1);
      this.bossDisp = this.bossDisp > frac ? Math.max(frac, this.bossDisp - dt * 0.35) : frac;
      const g = this.g, x = 336, y = 18, w = 408;
      g.fillStyle(0x06070a, 0.85); g.fillRect(x - 4, y - 4, w + 8, 22);
      g.fillStyle(0x3a2010, 1); g.fillRect(x, y, w, 14);
      g.fillStyle(0xffffff, 0.9); g.fillRect(x, y, Math.round(w * this.bossDisp), 14);
      g.fillStyle(frac > 0.66 ? 0xff8a20 : frac > 0.33 ? 0xff5a20 : 0xff2a2a, 1); g.fillRect(x, y, Math.round(w * frac), 14);
      g.fillStyle(0xffffff, 0.3); g.fillRect(x, y, Math.round(w * frac), 3);
      g.fillStyle(0x000000, 1); g.fillRect(x + Math.round(w * 0.66), y, 2, 14); g.fillRect(x + Math.round(w * 0.33), y, 2, 14);
      this.bossName.setVisible(true);
    } else this.bossName.setVisible(false);
  }
  drawSplats(dt) {
    const g = this.splatG; g.clear();
    for (let i = this.splats.length - 1; i >= 0; i--) {
      const s = this.splats[i]; s.t += dt; s.drip = Math.min(s.dripMax, s.drip + dt * 14);
      if (s.t >= s.life) { this.splats.splice(i, 1); continue; }
      const a = s.a * Math.min(1, 2 - 2 * s.t / s.life);
      g.fillStyle(0x6a0808, a); g.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r * 0.8);
      for (const [ox, oy, w] of s.sat) g.fillRect(s.x + ox - w / 2, s.y + oy - w / 2, w, w);
      g.fillRect(s.x - 2, s.y, 4, Math.round(s.drip / 4) * 4);
      g.fillStyle(0x9a1414, a * 0.7); g.fillRect(s.x - s.r / 4, s.y - s.r / 4, s.r / 2, s.r / 3);
    }
  }
  draw(time) {
    const g = this.g; g.clear();
    const panel = (x, y, w, h) => {
      g.fillStyle(0x06070a, 0.78); g.fillRect(x, y, w, h);
      g.fillStyle(0x3a424d, 1); g.fillRect(x, y, w, 2);
      g.fillStyle(0x1c2027, 1); g.fillRect(x, y + h - 2, w, 2); g.fillRect(x, y, 2, h); g.fillRect(x + w - 2, y, 2, h);
    };
    panel(14, 10, 302, 64);
    const frac = this.hp / TUNE.PLAYER_HP, dfrac = this.dispHp / TUNE.PLAYER_HP;
    const col = frac > 0.6 ? 0x5cff7a : frac > 0.3 ? 0xffc23a : 0xff3a2a;
    const ox = this.panelShake > 0 ? randi(-2, 2) : 0, oy = this.panelShake > 0 ? randi(-2, 2) : 0;   // bar jolts when hit
    for (let i = 0; i < 20; i++) {
      const t = (i + 1) / 20, x = 26 + i * 14 + ox, y = 42 + oy;
      let c = 0x1a1d22;
      if (t <= frac + 1e-6) c = col; else if (t <= dfrac + 1e-6) c = 0xffffff;
      g.fillStyle(c, 1); g.fillRect(x, y, 12, 20);
      if (c === col) { g.fillStyle(0xffffff, 0.28); g.fillRect(x, y, 12, 4); g.fillStyle(0x000000, 0.25); g.fillRect(x, y + 16, 12, 4); }
    }
    WEAPONS.forEach((w, i) => {
      const x = 14 + i * 52, y = 82, sel = i === this.weapon;
      g.fillStyle(sel ? 0x2a1806 : 0x06070a, sel ? 0.9 : 0.6); g.fillRect(x, y, 48, 52);
      g.lineStyle(2, sel ? 0xff8a1f : 0x2a2f37, 1); g.strokeRect(x + 1, y + 1, 46, 50);
    });
    panel(756, 10, 190, 76);
    if (this.styleA > 0.02) {                                           // progress toward the next style rank
      g.fillStyle(0x06070a, 0.7 * this.styleA); g.fillRect(850, 190, 94, 6);
      g.fillStyle(Phaser.Display.Color.HexStringToColor(STYLE_RANKS[Math.max(0, this.shownRank)].c).color, this.styleA); g.fillRect(851, 191, Math.round(92 * (this.styleFrac || 0)), 4);
    }
    if (this.rampA > 0) { g.fillStyle(0x06070a, 0.7); g.fillRect(850, 226, 94, 6); g.fillStyle(0xff7a2a, 1); g.fillRect(851, 227, Math.round(92 * this.rampA / TUNE.RAMPAGE.time), 4); }
    g.fillStyle(0x000000, 0.55 * this.hint1.alpha); g.fillRect(0, 494, VIEW_W, 38);   // backing strip for the control hints
    const fg = this.flashG; fg.clear();
    let red = this.hurtA * 0.6;
    if (this.hp > 0 && this.hp <= 30) red = Math.max(red, 0.2 + 0.14 * Math.sin(time / 160));
    const edge = (color, a) => {
      for (let i = 0; i < 6; i++) {
        const t = 12, ins = i * t, al = a * (1 - i / 6) * 0.5;
        fg.fillStyle(color, al);
        fg.fillRect(ins, ins, VIEW_W - ins * 2, t); fg.fillRect(ins, VIEW_H - ins - t, VIEW_W - ins * 2, t);
        fg.fillRect(ins, ins + t, t, VIEW_H - ins * 2 - t * 2); fg.fillRect(VIEW_W - ins - t, ins + t, t, VIEW_H - ins * 2 - t * 2);
      }
    };
    if (red > 0.01) edge(0xff1010, red);
    if (this.healA > 0.01) edge(0x30ff60, this.healA * 0.5);
    if (this.rampA > 0) edge(0xff6a10, 0.22 + 0.1 * Math.sin(time / 90));
    if (this.flashA > 0.01) { fg.fillStyle(0xfff2d8, this.flashA); fg.fillRect(0, 0, VIEW_W, VIEW_H); }
  }
}

// =============================================================================
//  BOOT

window.game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: VIEW_W,
  height: VIEW_H,
  backgroundColor: '#050608',
  pixelArt: true,                                    // nearest-neighbour + rounded pixels for crisp art
  audio: { noAudio: true },                          // all sound is our own Web Audio graph
  physics: { default: 'arcade', arcade: { gravity: { x: 0, y: TUNE.GRAVITY }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, TitleScene, GameScene, HudScene],
});
</script>
