function drawGlaiveBlade(ctx, cx, cy) {              // three hooked blades on a ring, centred on (cx, cy)
  for (let y = Math.floor(cy - 9); y < cy + 9; y++) for (let x = Math.floor(cx - 9); x < cx + 9; x++) {
    const px = x + 0.5 - cx, py = y + 0.5 - cy, d = Math.hypot(px, py);
    if (d < 1.6) R(ctx, '#e0ffff', x, y);
    else if (d < 2.6) R(ctx, '#46e6ff', x, y);
    else if (d > 3.2 && d < 5.4) R(ctx, (x + y) % 2 ? '#c8d0d8' : '#9aa4b0', x, y);
  }
  for (let k = 0; k < 3; k++) for (let t = 0; t <= 1.001; t += 0.12) {             // swept hooks
    const a = k * Math.PI * 2 / 3 + t * 1.1, r = 5 + t * 3.6;
    R(ctx, t > 0.7 ? '#ffffff' : '#e8eef4', Math.round(cx - 0.5 + Math.cos(a) * r), Math.round(cy - 0.5 + Math.sin(a) * r));
    if (t < 0.6) R(ctx, '#7c8692', Math.round(cx - 0.5 + Math.cos(a - 0.25) * (r - 0.6)), Math.round(cy - 0.5 + Math.sin(a - 0.25) * (r - 0.6)));
  }
}

const LEG4 = [[2, 0, -2, 0], [0, 0, 0, 1], [-2, 0, 2, 0], [0, 1, 0, 0]];
function drawGrunt(ctx, phase, open) {           // 20x18 biomech "husk"
  const [fo, flift, bo, blift] = LEG4[phase];
  const leg = (hx, off, lift, back) => {
    const fx = hx + off, fy = 16 - lift;
    for (let y = 12; y < fy; y++) { const t = (y - 12) / Math.max(1, fy - 13); R(ctx, back ? EP.fd : EP.f, Math.round(hx + off * t), y, 2, 1); }
    R(ctx, back ? EP.md : EP.m, fx - 1, fy, 3, 1); R(ctx, EP.bone, fx + 2, fy, 1, 1);
  };
  leg(6, bo, blift, true);
  R(ctx, EP.f, 4, 6, 9, 6); R(ctx, EP.f, 3, 8, 1, 3); R(ctx, EP.fl, 6, 9, 5, 2); R(ctx, EP.fd, 4, 11, 9, 1); R(ctx, EP.fd, 3, 10, 1, 1);
  R(ctx, EP.m, 4, 4, 7, 3); R(ctx, EP.ml, 5, 4, 5, 1); R(ctx, EP.md, 4, 6, 7, 1); R(ctx, EP.md, 6, 5, 1, 1); R(ctx, EP.md, 9, 5, 1, 1);
  R(ctx, EP.ml, 5, 3, 1, 1); R(ctx, EP.ml, 7, 2, 1, 2); R(ctx, EP.ml, 9, 3, 1, 1);
  R(ctx, EP.m, 12, 5, 5, 3); R(ctx, EP.ml, 13, 5, 3, 1); R(ctx, EP.md, 12, 7, 5, 1);
  if (open) { R(ctx, EP.eye, 14, 6, 3, 1); R(ctx, EP.eyeHi, 16, 6, 1, 1);
    R(ctx, EP.gum, 13, 8, 5, 2); R(ctx, EP.bone, 13, 8, 1, 1); R(ctx, EP.bone, 15, 8, 1, 1); R(ctx, EP.bone, 17, 8, 1, 1);
    R(ctx, EP.fd, 12, 10, 6, 1); R(ctx, EP.bone, 14, 10, 1, 1); R(ctx, EP.bone, 16, 10, 1, 1);
  } else { R(ctx, EP.eye, 15, 6, 2, 1); R(ctx, EP.eyeHi, 16, 6, 1, 1);
    R(ctx, EP.fd, 12, 8, 6, 2); R(ctx, EP.bone, 13, 8, 1, 1); R(ctx, EP.bone, 15, 8, 1, 1); R(ctx, EP.bone, 17, 8, 1, 1); R(ctx, EP.gum, 14, 9, 3, 1);
  }
  leg(11, fo, flift, false);
  R(ctx, EP.f, 10, 10, 3, 2); R(ctx, EP.fl, 10, 10, 2, 1); R(ctx, EP.bone, 13, 11, 1, 1); R(ctx, EP.bone, 12, 12, 1, 1);
}
function drawHeavy(ctx, phase, wind) {           // 28x28 armoured brute with a furnace core
  const [fo, flift, bo, blift] = LEG4[phase];
  const leg = (hx, off, lift, back) => {
    const fy = 25 - lift;
    for (let y = 19; y < fy; y++) { const t = (y - 19) / Math.max(1, fy - 20), lx = Math.round(hx + off * t);
      R(ctx, back ? EP.md : EP.m, lx - 2, y, 4, 1); if (!back) R(ctx, EP.ml, lx - 2, y, 1, 1); }
    const fx = hx + off; R(ctx, back ? EP.md : EP.m, fx - 3, fy, 6, 2); R(ctx, back ? EP.m : EP.ml, fx - 3, fy, 6, 1);
  };
  leg(10, bo, blift, true);
  R(ctx, EP.f, 7, 10, 14, 10); R(ctx, EP.fd, 7, 19, 14, 1);
  R(ctx, EP.fl, 10, 17, 1, 2); R(ctx, EP.fl, 13, 17, 1, 2); R(ctx, EP.fl, 16, 17, 1, 2);
  R(ctx, EP.m, 8, 9, 12, 8); R(ctx, EP.ml, 9, 9, 10, 1); R(ctx, EP.md, 8, 16, 12, 1); R(ctx, EP.md, 8, 9, 1, 8);
  if (wind) { R(ctx, EP.core, 11, 10, 6, 6); R(ctx, EP.coreHi, 12, 11, 4, 4); R(ctx, '#ffffff', 13, 12, 2, 2); }
  else { R(ctx, EP.core, 12, 11, 4, 4); R(ctx, EP.coreHi, 13, 12, 2, 2); }
  R(ctx, EP.fd, 12, 4, 6, 5); R(ctx, EP.f, 13, 4, 4, 1); R(ctx, EP.m, 14, 6, 4, 3); R(ctx, EP.ml, 14, 6, 4, 1); R(ctx, EP.eye, 16, 7, 2, 1);
  R(ctx, EP.m, 3, 8, 6, 5); R(ctx, EP.ml, 3, 8, 6, 1); R(ctx, EP.md, 3, 12, 6, 1); R(ctx, EP.ml, 5, 7, 1, 1);
  R(ctx, EP.m, 19, 8, 6, 5); R(ctx, EP.ml, 19, 8, 6, 1); R(ctx, EP.md, 19, 12, 6, 1); R(ctx, EP.ml, 22, 7, 1, 1);
  leg(17, fo, flift, false);
  if (!wind) {
    R(ctx, EP.f, 3, 13, 4, 6); R(ctx, EP.fd, 3, 18, 4, 1); R(ctx, EP.md, 2, 19, 6, 5); R(ctx, EP.m, 2, 19, 6, 1);

// ---- level ----------------------------------------------------------------------
// Built from rectangles (tile units) instead of a hand-typed ASCII grid: easier to keep exact.
// '#' = solid metal, '=' = one-way grating (jump up through, S+Space drops down), 'x' = breakable crate,
// 'g' = breakable girder. Only '#' is permanent.
function buildLevel() {
  const g = [];
  for (let y = 0; y < MAP_H; y++) g.push(new Array(MAP_W).fill('.'));
  const fill = (x, y, w, h, c = '#') => { for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (g[j] && i >= 0 && i < MAP_W) g[j][i] = c; };
  fill(0, 0, 100, 2); fill(0, 25, 100, 2); fill(0, 0, 2, 27); fill(98, 0, 2, 27);    // shell
  fill(14, 23, 4, 2, 'x'); fill(28, 23, 2, 2, 'x'); fill(38, 21, 19, 4); fill(78, 23, 2, 2, 'x');   // crate stacks + plateau
  fill(7, 24, 2, 1, 'x'); fill(69, 24, 2, 1, 'x'); fill(92, 23, 2, 2, 'x'); fill(34, 16, 1, 1, 'x'); fill(62, 16, 1, 1, 'x'); fill(90, 20, 1, 1, 'x');
  fill(32, 2, 2, 5); fill(66, 2, 2, 5);                                                // hanging pillars
  // platform tiers: standing surfaces are 4 tiles (64 px) apart - inside the ~79 px jump
  fill(7, 21, 6, 1, '='); fill(20, 21, 6, 1, 'g'); fill(68, 21, 7, 1, '='); fill(86, 21, 7, 1, 'g');
  fill(13, 17, 7, 1, '='); fill(30, 17, 7, 1, 'g'); fill(44, 17, 7, 1, '='); fill(60, 17, 7, 1, 'g'); fill(77, 17, 7, 1, '='); fill(92, 17, 6, 1);
  fill(2, 13, 7, 1); fill(22, 13, 7, 1, '='); fill(38, 13, 5, 1, 'g'); fill(52, 13, 5, 1, 'g'); fill(70, 13, 7, 1, '='); fill(84, 13, 6, 1, 'g');
  fill(12, 9, 7, 1, '='); fill(44, 9, 7, 1, 'g'); fill(60, 9, 5, 1, '='); fill(90, 9, 8, 1);
  return g;
}

function mergeRects(grid, ch, rowsOnly) {        // greedy-merge tiles into few static bodies (no seams to snag on)
  const H = grid.length, W = grid[0].length, used = grid.map(r => r.map(() => false)), out = [];
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (grid[y][x] !== ch || used[y][x]) continue;
    let w = 1; while (x + w < W && grid[y][x + w] === ch && !used[y][x + w]) w++;
    let h = 1;
    while (!rowsOnly && y + h < H) {
      let ok = true;
      for (let i = 0; i < w; i++) if (grid[y + h][x + i] !== ch || used[y + h][x + i]) { ok = false; break; }
      if (!ok) break; h++;
    }
    for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) used[y + j][x + i] = true;
    out.push({ x, y, w, h });
  }
  return out;
}

// =============================================================================
//  LIGHTWEIGHT PIXEL PARTICLES  (pooled, square "pixels", tile-aware)
//  Phaser's emitter can't collide with the tile grid; ours lets sparks bounce and
//  blood droplets stick: mode 1 = bounce, mode 2 = paint onto the level and die.
// =============================================================================
class FX {
  constructor(scene, max, depth = 12) {
    this.gN = scene.add.graphics().setDepth(depth);
    this.gA = scene.add.graphics().setDepth(depth + 1).setBlendMode(ADD);
    this.pool = []; this.live = []; this.solid = null; this.paint = null;
    for (let i = 0; i < max; i++) this.pool.push({});
  }
  emit(x, y, o) {
    const n = o.n || 1, spread = o.spread === undefined ? Math.PI * 2 : o.spread, ang = o.angle || 0, j = o.jitter || 0;
    for (let i = 0; i < n; i++) {
      const p = this.pool.pop(); if (!p) return;
      const a = ang + (Math.random() - 0.5) * spread, sp = rand(o.speed[0], o.speed[1]);
      p.x = x + (j ? rand(-j, j) : 0); p.y = y + (j ? rand(-j, j) : 0);
      p.vx = Math.cos(a) * sp + (o.vx || 0); p.vy = Math.sin(a) * sp + (o.vy || 0);
      p.max = p.life = rand(o.life[0], o.life[1]);
      p.s0 = o.size[0]; p.s1 = o.size[1]; p.cols = o.cols; p.fixed = o.randCol ? pick(o.cols) : undefined;
      p.a0 = o.alpha ? o.alpha[0] : 1; p.a1 = o.alpha ? o.alpha[1] : 1;
      p.g = o.g || 0; p.drag = o.drag || 0; p.add = !!o.add; p.mode = o.mode || 0;
      this.live.push(p);
    }
  }
  update(dt) {
    const L = this.live, solid = this.solid;
    for (let i = L.length - 1; i >= 0; i--) {
      const p = L[i];
      p.life -= dt;
      if (p.life <= 0) { L[i] = L[L.length - 1]; L.pop(); this.pool.push(p); continue; }
      p.vy += p.g * dt;
      if (p.drag) { const f = Math.exp(-p.drag * dt); p.vx *= f; p.vy *= f; }
      const nx = p.x + p.vx * dt, ny = p.y + p.vy * dt;
      if (p.mode && solid && solid(nx, ny)) {
        if (p.mode === 2) { if (this.paint) this.paint(nx, ny, p, solid(nx, p.y)); L[i] = L[L.length - 1]; L.pop(); this.pool.push(p); continue; }
        if (solid(nx, p.y)) p.vx *= -0.45; else p.x = nx;
        if (solid(p.x, ny)) { p.vy *= -0.35; p.vx *= 0.75; } else p.y = ny;
        continue;
      }
      p.x = nx; p.y = ny;
    }
  }
  draw() {
    const gN = this.gN, gA = this.gA; gN.clear(); gA.clear();
    for (const p of this.live) {
      const t = 1 - p.life / p.max, s = Math.round(p.s0 + (p.s1 - p.s0) * t);
      if (s <= 0) continue;
      const col = p.fixed !== undefined ? p.fixed : p.cols[Math.min(p.cols.length - 1, (t * p.cols.length) | 0)];
      const g = p.add ? gA : gN;
      g.fillStyle(col, p.a0 + (p.a1 - p.a0) * t);
      g.fillRect(Math.round(p.x - s / 2), Math.round(p.y - s / 2), s, s);
    }
  }
}

  buildInput() {

  // -------------------------------------------------------------- helpers ----
  solidAt(x, y) {
    const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
    if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
    const c = this.grid[ty][tx]; return c === '#' || c === 'x' || c === 'g';
  }
  standAt(x, y) {
    const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
    if (tx < 0 || ty < 0 || tx >= MAP_W || ty >= MAP_H) return true;
    return this.grid[ty][tx] !== '.';
  }
  losHard(x0, y0, x1, y1) {                                           // line of sight that ignores breakables
    const dx = x1 - x0, dy = y1 - y0, n = Math.ceil(Math.hypot(dx, dy) / 6);
    for (let i = 1; i < n; i++) if (this.tileAt(Math.floor((x0 + dx * i / n) / TS), Math.floor((y0 + dy * i / n) / TS)) === '#') return false;
    return true;
  }
  los(x0, y0, x1, y1) {
    const dx = x1 - x0, dy = y1 - y0, n = Math.ceil(Math.hypot(dx, dy) / 6);
    for (let i = 1; i < n; i++) if (this.solidAt(x0 + dx * i / n, y0 + dy * i / n)) return false;
    return true;
  }
  sweep(x0, y0, x1, y1) {          // grid ray between frames: no tunnelling through walls
    const dx = x1 - x0, dy = y1 - y0, n = Math.max(1, Math.ceil(Math.hypot(dx, dy) / 3));
    let lx = x0, ly = y0;
    for (let i = 1; i <= n; i++) {
      const x = x0 + dx * i / n, y = y0 + dy * i / n;
      if (this.solidAt(x, y)) return { x: lx, y: ly };
      lx = x; ly = y;
    }
    return null;
  }
  shake(dur, intensity) {
    intensity *= OPTS.shake; if (intensity <= 0) return;                 // pause menu: screen shake 100 / 50 / 0 %
    const now = this.time.now;
    if (now < this.shakeUntil && intensity <= this.shakeInt) return;
    this.cameras.main.shake(dur, intensity, true);
    this.shakeUntil = now + dur; this.shakeInt = intensity;
  }
  hitStop(ms) { this.hitStopUntil = Math.max(this.hitStopUntil, this.time.now + ms); }
  squash(sx, sy) { this.sqx = sx; this.sqy = sy; }

  // persistent gore: paint straight into the level canvas. 'source-atop' keeps paint on tile pixels only.
  paintDrop(x, y, col, wall) {
    const c = this.lvlCtx, ix = x | 0, iy = y | 0;
    c.globalCompositeOperation = 'source-atop'; c.fillStyle = numCss(col);
    c.fillRect(ix, iy, 1, 1);
    if (Math.random() < 0.5) c.fillRect(ix + randi(-1, 1), iy + randi(-1, 1), 1, 1);
    if (wall && Math.random() < 0.3) c.fillRect(ix, iy, 1, randi(2, 7));   // drip streak
    c.globalCompositeOperation = 'source-over'; this.lvlDirty = true;
  }
  paintSplat(x, y, r, horiz) {
    const c = this.lvlCtx; c.globalCompositeOperation = 'source-atop';
    for (let i = 0, n = Math.round(r * 4); i < n; i++) {
      c.fillStyle = BLOOD_CSS[(Math.random() * BLOOD_CSS.length) | 0];
      const ox = horiz ? rand(-r, r) : rand(-2.5, 2.5), oy = horiz ? rand(-2.5, 2.5) : rand(-r, r), s = Math.random() < 0.25 ? 2 : 1;
      c.fillRect((x + ox) | 0, (y + oy) | 0, s, s);
    }
    c.globalCompositeOperation = 'source-over'; this.lvlDirty = true;
  }
  paintSplatAround(x, y, r) {
    for (let yy = y; yy < y + 60; yy += 2) if (this.solidAt(x, yy)) { this.paintSplat(x, yy + 1, r, true); break; }
    for (const d of [-1, 1]) for (let xx = 0; xx < 30; xx += 2) if (this.solidAt(x + d * xx, y - 6)) { this.paintSplat(x + d * xx + d, y - 6, r * 0.6, false); break; }

  paintScorch(x, y, r) {
    const c = this.lvlCtx, x0 = Math.floor(x - r), y0 = Math.floor(y - r);
    c.globalCompositeOperation = 'source-atop';
    for (let j = 0; j <= r * 2; j++) for (let i = 0; i <= r * 2; i++) {
      const dx = x0 + i - x, dy = y0 + j - y, d = Math.sqrt(dx * dx + dy * dy) / r;

    c.globalCompositeOperation = 'source-over'; this.lvlDirty = true;
  }
  paintHole(x, y) {
    const c = this.lvlCtx; c.globalCompositeOperation = 'source-atop';
    c.fillStyle = '#08090b'; c.fillRect(x | 0, y | 0, 1, 1);
    c.fillStyle = 'rgba(140,150,165,0.6)'; c.fillRect((x | 0) + randi(-1, 1), (y | 0) + randi(-1, 1), 1, 1);
    c.globalCompositeOperation = 'source-over'; this.lvlDirty = true;
  }

  // particle presets

  spawnLight(x, y, key, tint, s0, s1, a0, dur, frame, flip) {
    const l = this.lights.find(o => !o.on) || this.lights[0];
    l.setTexture(key, frame).setFlipX(!!flip).setPosition(x, y).setTint(tint).setScale(s0).setAlpha(a0).setVisible(true);

  // ---------------------------------------------------------------- update ----
  update(time, delta) {
    const now = time;
    const ts = now < this.hitStopUntil ? 14 : this.wheelOn ? 6 : now < this.slowmoUntil ? 2.6 : 1;   // hit-stop / weapon wheel / slow-mo via Arcade timeScale
    this.physics.world.timeScale = ts;
    const dt = Math.min(delta, 50) / 1000 / ts;
    const K = this.keys, JD = Phaser.Input.Keyboard.JustDown;
    for (const k of ['SPACE', 'W', 'UP', 'J', 'Q', 'E', 'F', 'ONE', 'TWO', 'THREE', 'FOUR', 'FIVE', 'SIX', 'SEVEN', 'EIGHT', 'NINE', 'ZERO', 'MINUS', 'PLUS', 'BACKSPACE', 'OPEN_BRACKET',
      'CLOSED_BRACKET', 'BACK_SLASH', 'SEMICOLON', 'QUOTES', 'COMMA', 'PERIOD', 'FORWARD_SLASH', 'SHIFT', 'G', 'T', 'C', 'R', 'M', 'N', 'B', 'P', 'V', 'ENTER', 'ESC']) this.jd[k] = JD(K[k]);
    if (this.needReset) {
      this.needReset = false;
      BUS.emit('reset', { hp: this.hp, weapon: this.weapon, enemies: this.enemiesLeft });
      BUS.emit('wave', 1, WAVES.length);
      BUS.emit('mines', TUNE.MINE.max);
      BUS.emit('wavecard', 'WAVE 1', 'THE MELT FLOOR :: CLEAR THE ARENA');
      Music.track(WAVE_MUSIC[0], true);                               // every (re)start begins the stage theme from the top
    }
    if (this.jd.M) Sfx.toggleMute();
    if (this.jd.B && window.SLAG_MUSIC) BUS.emit('callout', Music.toggle() ? 'SAMPLED MUSIC' : 'SYNTH MUSIC');
    if (this.jd.N && window.SLAG_SFX) { Sfx.useBank = !Sfx.useBank; Sfx.arcSet(false); Sfx.flameSet(false); Sfx.cryoSet(false); Sfx.ripperSet(0); Sfx.lanceSet(0); Sfx.swarmSet(0); BUS.emit('callout', Sfx.useBank ? 'SAMPLED SFX' : 'SYNTH SFX'); }
    if (this.jd.V) { this.togglePostFx(); BUS.emit('callout', POSTFX.on ? 'POST FX ON' : 'POST FX OFF'); }
    if (this.jd.R || (this.overShown && this.jd.ENTER)) { this.restartRun(); return; }
    if ((this.jd.ESC || this.jd.P) && this.state === 'play') { this.pauseGame(); return; }        // Esc / P: pause menu (resume, restart, quit)
    else if (this.jd.ESC) { this.quitToTitle(); return; }
    if (this.jd.J) this.aimMode = 'keys';

    if (this.state !== 'dead') { this.updatePlayer(dt, now); this.updateHook(dt); } else if (this.hook) this.hook = null;
    this.updateEnemies(dt, now);
    this.updateHarpoons(dt, now); this.updateLinkBeams(dt, now);
    this.updateHornets(dt); this.updateGlaive(dt, now);
    this.updateHpOrbs(dt, now); this.updateCoils(dt, now); this.updatePWaves(dt);
    if (this.mod === 'melt' || this.tide) this.updateTide(dt, now);
    this.updatePostFx(dt, now);
    this.updateProjectiles(dt);
    this.updateStakes(dt); this.updateMines(dt); this.updateCharges(dt); this.updateHaywires(dt); this.updateCanisters(dt);
    this.updateSentry(dt, now); this.updateWrecks(dt); if (this.mod === 'slag' && this.state === 'play') this.updateSlagRain(dt);
    this.updateOrbs(dt, now);
    this.updateBarrels(dt);
    this.updateHazards(dt, now);
    this.updateEProjs(dt);
    this.updateFallingBlocks(dt);
    if (this.stabQ.length) this.processStability();
    if (this.breakDirty) this.rebuildBreakZones();
    if (this.onewayDirty) this.rebuildOneways();
    if (this.navDirtyT > 0 && (this.navDirtyT -= dt) <= 0) this.rebuildNav();
    this.updateGibs(dt, now);
    this.updateRagdolls(dt, now);
    this.updateAmbient(dt, now);
    this.updateFxSprites(dt);
    this.updateStyle(dt);
    this.fx.update(dt); this.fx.draw();
    Sfx.arcSet(now < this.arcActiveUntil && this.state !== 'dead');
    Sfx.flameSet(now < this.flameActiveUntil && this.state !== 'dead');
    Sfx.cryoSet(now < this.cryoActiveUntil && this.state !== 'dead');
    Sfx.miniSet(this.state !== 'dead' ? this.spin : 0);
    Sfx.ripperSet(this.state !== 'dead' && now < this.ripperUntil ? (now < this.ripperBiteUntil ? 1 : 0.55) : 0);
    Sfx.lanceSet(this.state !== 'dead' && this.lanceOn ? this.lanceCharge : 0);
    Sfx.swarmSet(this.state !== 'dead' ? this.swarmLvl : 0);
    // music follows the fight: noticed -> fighting -> boss / high style
    let I = 0;
    if (this.state === 'play') {
      let aware = 0; for (const e of this.enemies.getChildren()) if (e.alive && e.aggro) aware++;
      if (aware > 0) I = 1;

      if ((this.boss && this.boss.alive) || this.style.rank >= 4 || now < this.rampageUntil) I = 3;
    }

    const mode = this.state === 'dead' ? 'none' : this.aimMode;
    if (mode !== this.lastAimMode) { this.lastAimMode = mode; BUS.emit('aim', mode); }
    if (this.state !== 'dead' && this.hp <= 30) {                     // low-health heartbeat, faster as HP drops
      this.heartT -= delta / 1000;

    if (this.lvlDirty && now - this.lvlRefreshAt > 90) { this.lvlTex.refresh(); this.lvlDirty = false; this.lvlRefreshAt = now; }   // throttled GPU upload
  }

  updatePlayer(dt, now) {
    const T = TUNE, p = this.player, b = p.body, K = this.keys;
    const left = K.A.isDown || K.LEFT.isDown, right = K.D.isDown || K.RIGHT.isDown, down = K.S.isDown || K.DOWN.isDown;
    const jumpHeld = K.SPACE.isDown || K.W.isDown || K.UP.isDown;
    const jumpPressed = this.jd.SPACE || this.jd.W || this.jd.UP;
    const onGround = b.blocked.down || b.touching.down;
    if (onGround) this.lastGround = now;
    if (jumpPressed) this.jumpBuffer = now;

    // horizontal: snappy accel on ground, softer in air, rocket-jump momentum decays slowly
    const dir = (right ? 1 : 0) - (left ? 1 : 0), target = dir * T.RUN_SPEED * (1 - 0.4 * this.spin);   // a spun-up minigun slows you
    let vx = b.velocity.x;
    if (onGround) vx = approach(vx, target, (dir !== 0 && Math.sign(vx) !== -dir ? T.GROUND_ACCEL : T.GROUND_DECEL) * dt);
    else if (Math.abs(vx) > T.RUN_SPEED && (dir === 0 || dir === Math.sign(vx))) vx = approach(vx, Math.sign(vx) * T.RUN_SPEED, T.AIR_MOMENTUM_DECAY * dt);
    else vx = approach(vx, target, (dir ? T.AIR_ACCEL : T.AIR_DECEL) * dt);
    b.setVelocityX(vx);

    // jump: buffered + coyote time; S/Down + jump drops through gratings
    if (jumpPressed && down && onGround && this.onOneWay()) {

    } else if (now - this.jumpBuffer <= T.JUMP_BUFFER_MS && now - this.lastGround <= T.COYOTE_MS) {
      b.setVelocityY(-T.JUMP_VELOCITY); this.jumpBuffer = -1e9; this.lastGround = -1e9; this.jumpCuttable = true;
      Sfx.jump(); this.fxDust(p.x, b.bottom, 5); this.squash(0.72, 1.3);
    }
    if (this.jumpCuttable && !jumpHeld && b.velocity.y < -80) { b.setVelocityY(b.velocity.y * T.JUMP_CUT); this.jumpCuttable = false; }
    if (b.velocity.y >= 0) this.jumpCuttable = false;
    b.setGravityY(b.velocity.y > 0 ? T.FALL_EXTRA : 0);
    if (b.velocity.y > T.MAX_FALL) b.setVelocityY(T.MAX_FALL);
    if (onGround && !this.wasGround && this.lastVy > 160) {
      this.squash(1.3, 0.72); this.fxDust(p.x, b.bottom, Math.min(10, (this.lastVy / 50) | 0)); Sfx.land(Math.min(1, this.lastVy / 500));

    }

    // dash (Shift): a short burst in the held direction with i-frames; one in the air until you land
    if (onGround) this.dashAir = true;
    const up = K.W.isDown || K.UP.isDown;
    if (this.jd.SHIFT && now >= this.dashReady && (onGround || this.dashAir)) this.startDash(now, dir, (down ? 1 : 0) - (up ? 1 : 0), onGround);
    if (now < this.dashUntil) {
      b.setVelocity(this.dashVx, this.dashVy);
      if ((this.dashGhostT -= dt) <= 0) { this.dashGhostT = 0.022; this.spawnLight(this.pv.x, this.pv.y - 12, 'player', 0x46e6ff, 1, 1, 0.55, 0.2, this.pFrame, this.facing < 0); }
      this.fx.emit(p.x, p.y + rand(-7, 7), { n: 1, angle: Math.atan2(-this.dashVy, -this.dashVx), spread: 0.3, speed: [40, 120], life: [0.1, 0.22], size: [2, 1], cols: [0xffffff, 0x9af0ff, 0x46b8f0], add: true });
    } else if (this.dashing) {
      this.dashing = false; b.setAllowGravity(true);
      b.setVelocity(this.dashVx * TUNE.DASH.keep, this.dashVy * TUNE.DASH.keep);
    }
    if (this.diving) {                                                  // hammer ground-pound: straight down, slam on landing
      b.setVelocityY(TUNE.HAMMER.dive); b.velocity.x *= Math.pow(0.02, dt);
      if ((this.diveFxT = (this.diveFxT || 0) - dt) <= 0) { this.diveFxT = 0.02; this.spawnLight(this.pv.x, this.pv.y - 12, 'player', 0xffa040, 1, 1, 0.5, 0.18, this.pFrame, this.facing < 0); }

    const k = Math.min(1, dt * 4);

    // weapons
    if (this.jd.ONE) this.setWeapon(0);
    if (this.jd.TWO) this.setWeapon(1);
    if (this.jd.THREE) this.setWeapon(2);
    if (this.jd.FOUR) this.setWeapon(3);
    if (this.jd.FIVE) this.setWeapon(4);
    if (this.jd.SIX) this.setWeapon(5);
    if (this.jd.SEVEN) this.setWeapon(6);
    if (this.jd.EIGHT) this.setWeapon(7);
    if (this.jd.NINE) this.setWeapon(8);
    if (this.jd.ZERO) this.setWeapon(9);
    if (this.jd.MINUS) this.setWeapon(10);
    if (this.jd.PLUS) this.setWeapon(11);
    if (this.jd.BACKSPACE) this.setWeapon(12);
    if (this.jd.OPEN_BRACKET) this.setWeapon(13);
    if (this.jd.CLOSED_BRACKET) this.setWeapon(14);
    if (this.jd.BACK_SLASH) this.setWeapon(15);
    if (this.jd.SEMICOLON) this.setWeapon(16);
    if (this.jd.QUOTES) this.setWeapon(17);
    if (this.jd.COMMA) this.setWeapon(18);

    this.flameActiveUntil = now + 100; this.stats.shots++; this.recoil = 1;
    for (let i = 0; i < 3; i++) this.fx.emit(ox, oy, { n: 1, angle: a, spread: W.cone * 2 * DEG, speed: [170, 240], life: [0.25, 0.42], size: [2, 7], cols: [0xffffff, 0xfff0a0, 0xffb040, 0xff6a1a, 0xc03010, 0x502820], add: true, drag: 1.5, g: -60, vx: pvx });

  // ------------------------------------------------------------- singularity ----
  // Slow orb that anchors on contact into a well: drags enemies, gibs (and a little of you) in, then implodes.
  spawnOrb(x, y, a) {

    const W = TUNE.SING;
    o.enableBody(true, x, y, true, true); o.body.setAllowGravity(false); o.body.setSize(6, 6, true);
    o.setVelocity(Math.cos(a) * W.speed, Math.sin(a) * W.speed);

  }
  updateOrbs(dt, now) {
    const W = TUNE.SING;
    for (const o of this.orbList) {
      if (!o.active) continue;
      o.t -= dt;
      if (o.mode === 'fly') {
        const hit = this.sweep(o.px, o.py, o.x, o.y), hitE = this.enemyAt(o.x, o.y, 3);
        if (hit || hitE || o.t <= 0) {
          if (hit) o.body.reset(hit.x, hit.y);
          o.body.setVelocity(0, 0); o.mode = 'well'; o.t = W.well;
          o.core.setVisible(true).setPosition(o.x, o.y).setScale(0.3);

          this.fx.emit(o.x, o.y, { n: 1, speed: [0, 10], life: [0.2, 0.4], size: [3, 1], cols: [0xffffff, 0xd0a0ff, 0x7030d0], add: true });

      o.core.setPosition(cx, cy).setScale(0.6 + k * 0.6 + Math.sin(now / 40) * 0.05).setRotation(now / 200);
      o.glow.setPosition(cx, cy).setScale(2.5 + Math.sin(now / 60) * 0.4).setAlpha(0.7);
      const pull = (b, str, cap) => {
        const dx = cx - b.center.x, dy = cy - b.center.y, d = Math.hypot(dx, dy);
        if (d > R || d < 3) return false;

        pull(g.body, 2600, 420);

    for (let i = 0; i < 6; i++) this.spawnGib(pick(gibs), x + rand(-6, 6), y + rand(-4, 4), rand(-200, 200), rand(-260, -80), 'metal');
    this.fxDust(x, y + hh, 10); this.fxSmoke(x, y, 4, 1); this.fxSparks(x, y + hh, 8, -Math.PI / 2, 2.4, [80, 240]);
    Sfx.smash(c); this.shake(110, 0.005); this.addKick(0, 2);
    this.damageTile(Math.floor(x / TS), Math.floor((y + hh + 1) / TS), 26);   // pancakes into whatever it lands on
    for (const { rd } of this.pushRagdolls(x, y, 26, 300, 160)) this.hitRagdoll(rd, x, y, 30, 0, 1, 'blast');
    for (const e of this.enemies.getChildren()) if (e.alive && Math.abs(e.body.center.x - x) < 16 && Math.abs(e.body.bottom - (y + hh)) < 10) this.damageEnemy(e, 20, Math.sign(e.x - x) || 1, -1, 'crush');
  }

  // ------------------------------------------------------------ enemy rockets & bombs ----
  // Slow enough to read: shoot them down, kick them back, or just get out of the splash.
  spawnEProj(kind, x, y, vx, vy) {
    const p = this.eprojs.getFirstDead(false); if (!p) return null;
    p.setTexture(kind === 'bomb' ? 'ebomb' : kind === 'fire' ? 'firebomb' : 'erocket').enableBody(true, x, y, true, true);
    p.body.setSize(5, 5, true); p.body.setAllowGravity(kind !== 'rocket');
    p.setVelocity(vx, vy); p.setRotation(Math.atan2(vy, vx));
    Object.assign(p, { pk: kind, life: kind === 'rocket' ? 3.5 : 4, px: x, py: y });
    p.glow.setVisible(true).setPosition(x, y).setTint(kind === 'bomb' ? 0xff3020 : kind === 'fire' ? 0xff8a20 : 0xffa040);
    return p;
  }
  popEProj(p, x = p.x, y = p.y) {
    p.disableBody(true, true); p.glow.setVisible(false);
    this.explode(x, y, p.pk === 'bomb' ? TUNE.WASP.bomb : p.pk === 'fire' ? TUNE.PYRO.burst : TUNE.ROCKETEER.blast);
    if (p.pk === 'fire') this.spawnFirePatch(x, y);
  }
  updateEProjs(dt) {
    const pb = this.player.body;
    for (const p of this.eprojList) {
      if (!p.active) continue;
      p.life -= dt;
      const hit = this.sweep(p.px, p.py, p.x, p.y);
      const onP = this.state !== 'dead' && p.x > pb.left - 3 && p.x < pb.right + 3 && p.y > pb.top - 3 && p.y < pb.bottom + 3;
      const landed = p.pk !== 'rocket' && p.body.velocity.y > 0 && this.standAt(p.x, p.y + 3);   // gratings catch bombs too
      if (hit || onP || landed || p.life <= 0) { this.popEProj(p, hit ? hit.x : p.x, hit ? hit.y : p.y); continue; }
      let shot = null;
      for (const b of this.bulletList) if (b.active && Math.abs(b.x - p.x) < 7 && Math.abs(b.y - p.y) < 7) { shot = b; break; }
      if (shot) { shot.disableBody(true, true); this.popEProj(p); BUS.emit('callout', 'SHOT DOWN'); this.addStyle(40); continue; }
      const a = Math.atan2(p.body.velocity.y, p.body.velocity.x);
      p.setRotation(a);
      if (p.pk === 'rocket') {
        const tx = p.x - Math.cos(a) * 5, ty = p.y - Math.sin(a) * 5;
        this.fx.emit(tx, ty, { n: 1, speed: [5, 20], life: [0.4, 0.8], size: [2, 5], cols: [0x8a8580, 0x5a5652, 0x3a3836], alpha: [0.5, 0], g: -25, drag: 2, jitter: 1 });
        this.fx.emit(tx, ty, { n: 1, angle: a + Math.PI, spread: 0.6, speed: [20, 60], life: [0.08, 0.16], size: [3, 1], cols: [0xffffff, 0xffe46a, 0xff8a1f], add: true });
      } else if (Math.random() < 0.5) this.fx.emit(p.x, p.y - 3, { n: 1, speed: [0, 8], life: [0.1, 0.2], size: [2, 1], cols: [0xffe46a, 0xff5a1a], add: true });
      p.px = p.x; p.py = p.y;
    }
  }

  // ------------------------------------------------------------------ rocketeer ----
  // Humanoid with a launcher: keeps its distance, 0.75 s orange laser tell, slow rocket aimed at your feet.
  thinkRocketeer(e, dt, now, c) {
    const T = TUNE.ROCKETEER;
    e.fireCd -= dt; e.repickT -= dt;
    switch (e.ai) {
      case 'idle': this.lookAround(e, dt); return 'hold';
      case 'dodge': if (c.onGround && now > e.aiUntil + 120) { e.ai = 'engage'; e.repickT = 0; } return 'free';
      case 'aim': {
        const k = (now - e.aimStart) / T.aimMs;
        if (k < T.lockAt) e.aimA = this.rocketAim(e);
        if (!c.canSee && k < 0.4) { e.ai = 'engage'; e.fireCd = 0.6; return 'hold'; }
        if (now >= e.aiUntil) { this.rocketeerShoot(e); e.fireCd = T.fireCd * rand(0.85, 1.15); e.ai = 'engage'; e.repickT = Math.random() < 0.5 ? 0 : 1.2; }
        return 'hold';
      }
      case 'retreat': if (now > e.aiUntil) { e.ai = 'engage'; e.repickT = 0; } return 'path';
      case 'search':
        if (c.canSee || now - e.lkT < 300) { e.ai = 'engage'; e.repickT = 0; return 'path'; }
        if (now > e.searchUntil || !c.alive) { e.ai = 'idle'; e.aggro = false; return 'hold'; }
        if (!e.path || e.pathI >= e.path.length) { this.lookAround(e, dt, 2.5); return 'hold'; }
        return 'path';
      default: {
        if (!c.alive) { e.ai = 'idle'; e.aggro = false; return 'hold'; }
        if (now - e.lkT > 1800) { e.ai = 'search'; e.searchUntil = now + 6000; this.pathTo(e, navBelow(e.lkx, e.lky - 4), 160); return 'path'; }
        if (c.dist < 80 && c.onGround && !e.navAir && e.repickT < 1.5) { e.repickT = 2; e.ai = 'retreat'; e.aiUntil = now + 1400; this.pickPosition(e, 'retreat'); return 'path'; }
        if (c.onGround && !e.navAir && e.repickT <= 0) { e.repickT = rand(3, 4.5); if (!this.pickPosition(e, 'attack')) this.pathTo(e, navBelow(e.lkx, e.lky - 4), 160); }
        if (c.canSee && c.onGround && !e.navAir && e.fireCd <= 0 && c.dist < 340 && c.dist > 60) {
          e.ai = 'aim'; e.aimStart = now; e.aiUntil = now + T.aimMs; e.aimA = this.rocketAim(e); Sfx.charge(0.6); return 'hold';
        }
        return 'path';
      }
    }
  }
  rocketAim(e) {                                                       // aims at your feet so near misses still splash
    const pb = this.player.body, sx = e.x, sy = e.y - 2, tof = Math.hypot(pb.center.x - sx, pb.bottom - sy) / TUNE.ROCKETEER.rocketSpeed;
    return Math.atan2(pb.bottom - 3 - sy + (pb.blocked.down ? 0 : pb.velocity.y * tof * 0.2), pb.center.x + pb.velocity.x * tof * 0.5 - sx);
  }
  rocketeerShoot(e) {
    const T = TUNE.ROCKETEER, sx = e.x + (e.dir > 0 ? 0 : -1), sy = e.y - 2, a = e.aimA + rand(-2, 2) * DEG;
    const mx = sx + Math.cos(a) * 22, my = sy + Math.sin(a) * 22;
    e.recoil = 5; e.body.velocity.x -= Math.cos(a) * 60;
    Sfx.rocket(); this.spawnLight(mx, my, 'glow', 0xffa040, 1, 1.8, 0.9, 0.12);
    this.fxSmoke(sx - Math.cos(a) * 8, sy - Math.sin(a) * 8, 6); this.fxFire(mx, my, 4);
    if (this.solidAt(mx, my) || !this.los(sx, sy, mx, my)) return;
    this.spawnEProj('rocket', mx, my, Math.cos(a) * T.rocketSpeed, Math.sin(a) * T.rocketSpeed);
  }

  // ---------------------------------------------------------------------- wasp ----
  // Bomber drone: climbs to a perch well above your head, then makes straight bomb runs over you
  // (blinking bomb sight, 3 bombs) and peels away to line up the next one.
  updateWasp(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, T = TUNE.WASP, pb = this.player.body;
    if (alive && !e.aggro && (e.sees || dist < 140) && dist < e.def.sight) { this.alertEnemy(e, now); Sfx.chirp(); }
    if (e.aggro && e.sees) e.aggroT = Math.max(e.aggroT, 4);
    if (e.aggro && (e.aggroT <= 0 || !alive)) { e.aggro = false; e.ai = 'patrol'; }
    let tx, ty, spd = T.speed;
    if (e.ai === 'run' && alive) {
      tx = e.x + e.runDir * 200; ty = e.runY; spd = T.speed * 1.5;
      e.bombT -= dt;
      if (e.bombT <= 0 && e.bombs > 0 && Math.abs(e.x - pb.center.x) < 64) { e.bombT = T.bombGap; e.bombs--; this.waspDrop(e); }
      const passed = e.runDir > 0 ? e.x > pb.center.x + 110 : e.x < pb.center.x - 110, walled = e.runDir > 0 ? b.blocked.right : b.blocked.left;
      if (now > e.aiUntil || walled || (passed && e.bombs < T.runBombs)) { e.ai = 'rest'; e.aiUntil = now + T.rest * 1000; e.runEnd = now; }
    } else if (e.aggro && alive) {
      const side = e.x < pb.center.x ? -1 : 1, rest = e.ai === 'rest' && now < e.aiUntil;
      tx = pb.center.x + side * (rest ? 140 : 95);
      for (const o of this.enemies.getChildren()) if (o !== e && o.alive && o.kind === 'wasp' && Math.abs(o.x - e.x) < 30 && Math.abs(o.y - e.y) < 24) tx += e.x <= o.x ? -45 : 45;   // don't stack up
      if ((e.altT = (e.altT || 0) - dt) <= 0) { e.altT = 0.3; e.alt = this.waspAlt(pb, pb.center.x); }
      ty = e.alt + Math.sin(e.t * 2) * 6;
      if (!rest) {
        e.ai = 'stalk';
        if (Math.abs(e.y - ty) < 20 && Math.abs(e.x - tx) < 40 && now - (e.runEnd || 0) > 600) { e.ai = 'run'; e.runDir = -side; e.runY = e.alt; e.bombs = T.runBombs; e.bombT = 0.1; e.aiUntil = now + 3200; Sfx.chirp(); }
      }
    } else { tx = e.homeX + Math.sin(e.t * 0.5) * 60; ty = e.homeY + Math.sin(e.t * 1.3) * 10; }
    if (e.stunT <= 0) {
      const k = Math.min(1, dt * 3);
      b.velocity.x += (clamp((tx - b.center.x) * 2.2, -spd, spd) - b.velocity.x) * k;
      b.velocity.y += (clamp((ty - b.center.y) * 2.2, -spd * 0.8, spd * 0.8) - b.velocity.y) * k;
    } else { const f = Math.pow(0.05, dt); b.velocity.x *= f; b.velocity.y *= f; }
    if (Math.abs(b.velocity.x) > 8) e.dir = b.velocity.x > 0 ? 1 : -1;
    e.fr = e.ai === 'run' && e.bombs > 0 ? 'pb' : Math.floor(e.t * 18) % 2 ? 'p1' : 'p0';
  }
  waspAlt(pb, x) {                                                     // highest clear flight lane 45-95 px over your head
    for (const off of [92, 80, 68, 56, 44]) {
      const y = pb.top - off; let clear = true;
      for (let xx = x - 150; xx <= x + 150 && clear; xx += 10) if (this.solidAt(xx, y - 7) || this.solidAt(xx, y + 7)) clear = false;
      if (clear) return y;
    }
    return pb.top - 36;
  }
  waspDrop(e) {
    const b = e.body;
    this.spawnEProj('bomb', e.x, b.bottom + 3, b.velocity.x * 0.6, 30);
    Sfx.whistle(); Sfx.clunk(0.6);
  }

  // -------------------------------------------------------------------- rammer ----
  // Armoured charger: snorts and scrapes (0.65 s), then bulldozes in a straight line, smashing crates and
  // girders and trampling its own side. Its ram plate shrugs off frontal fire; slam it into solid metal
  // and it's dizzy - and takes double damage - for a moment.
  updateRammer(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, D = e.def, T = TUNE.RAMMER, onGround = b.blocked.down || b.touching.down, adx = Math.abs(dx), pb = this.player.body;
    const sees = e.sees || (alive && adx < D.sight && Math.abs(dy) < 40 && this.losHard(b.center.x, b.center.y - 3, pb.center.x, pb.center.y - 4));   // crates don't hide you from it
    if (alive && !e.aggro && sees && adx < D.sight && Math.abs(dy) < 80) this.alertEnemy(e, now);
    if (e.aggro && sees) e.aggroT = Math.max(e.aggroT, 4);
    if (e.aggro && (e.aggroT <= 0 || !alive) && e.ai !== 'charge') { e.aggro = false; e.ai = 'patrol'; }
    e.atkCd -= dt;
    let fr = null;
    if (e.ai === 'wind') {
      b.velocity.x = 0; fr = 'wind';
      if (Math.random() < 0.4) this.fxDust(b.center.x - e.dir * 8, b.bottom, 1);
      if (now >= e.aiUntil) { e.ai = 'charge'; e.aiUntil = now + T.chargeT * 1000; e.hitSet = new Set(); Sfx.growl(true); this.shake(120, 0.004); }
    } else if (e.ai === 'charge') {
      b.velocity.x = e.dir * T.speed; fr = Math.floor(now / 70) % 2 ? 'c0' : 'c1';
      if (Math.random() < 0.6) this.fxDust(b.center.x - e.dir * 10, b.bottom, 1);
      if (Math.floor(now / 140) !== e.stepK) { e.stepK = Math.floor(now / 140); Sfx.land(0.5); this.shake(50, 0.002); }
      const fx = e.dir > 0 ? b.right + 2 : b.left - 2;
      for (let yy = b.top + 2; yy < b.bottom - 1; yy += 6) {                // bulldozes breakables
        const tx = Math.floor(fx / TS), ty = Math.floor(yy / TS), ch = this.tileAt(tx, ty);
        if (ch === 'x' || ch === 'g') { this.destroyTile(tx, ty, true); this.addKick(e.dir * 2, 0); }
      }
      for (const o of this.enemies.getChildren()) {                       // ...and its own side
        if (o === e || !o.alive || e.hitSet.has(o) || o.kind === 'boss') continue;
        const ob = o.body; if (ob.right < b.left - 2 || ob.left > b.right + 2 || ob.bottom < b.top || ob.top > b.bottom) continue;
        e.hitSet.add(o); const k = Math.max(0.3, o.def.kb);
        o.body.velocity.x = e.dir * 380 * k; o.body.velocity.y = -260 * k; o.kickedT = 0.6;
        this.damageEnemy(o, 40, e.dir, -0.5, 'kick'); Sfx.kickHit();
      }
      if (alive && !e.hitP && pb.right > b.left - 2 && pb.left < b.right + 2 && pb.bottom > b.top && pb.top < b.bottom) {
        e.hitP = true;
        if (this.hurtPlayer(T.dmg, b.center.x)) { pb.velocity.x = e.dir * 420; pb.velocity.y = -260; this.shake(200, 0.012); this.addKick(e.dir * 8, -3); Sfx.kickHit(); }
      }
      if ((e.dir > 0 ? b.blocked.right : b.blocked.left) && (this.solidAt(fx, b.center.y) || this.solidAt(fx, b.bottom - 4))) {   // hit solid metal: seeing stars
        e.ai = 'dizzy'; e.aiUntil = now + T.stun * 1000; b.velocity.x = -e.dir * 120; b.velocity.y = -150;
        this.shake(300, 0.012); Sfx.stomp(); Sfx.clang(); this.fxSparks(fx, b.center.y, 14, e.dir > 0 ? Math.PI : 0, 1.4, [80, 260]);
        this.blastTiles(fx + e.dir * 6, b.center.y, 20, 60);
        if (Math.hypot(this.player.x - e.x, this.player.y - e.y) < 320) BUS.emit('callout', 'BONK!');
      } else if (now >= e.aiUntil) { e.ai = 'skid'; e.aiUntil = now + 450; }
    } else if (e.ai === 'skid') {
      b.velocity.x = approach(b.velocity.x, 0, 900 * dt); fr = 'w0';
      if (Math.random() < 0.8) this.fxDust(b.center.x + e.dir * 8, b.bottom, 1);
      if (now >= e.aiUntil) { e.ai = 'chase'; e.atkCd = T.cd; }
    } else if (e.ai === 'dizzy') {
      if (onGround) b.velocity.x = approach(b.velocity.x, 0, 600 * dt); fr = 'dz';
      if (Math.random() < 0.6) this.fx.emit(b.center.x + Math.cos(now / 110) * 9, b.top - 3 + Math.sin(now / 110) * 2, { n: 1, speed: [0, 5], life: [0.2, 0.3], size: [2, 1], cols: [0xffe14a, 0xffffff], add: true });
      if (now >= e.aiUntil) { e.ai = 'chase'; e.atkCd = T.cd * 0.6; }
    } else if (e.aggro && alive) {
      e.ai = 'chase'; e.dir = dx > 0 ? 1 : -1;
      const ground = this.standAt(b.center.x + e.dir * (b.halfWidth + 4), b.bottom + 4);
      b.velocity.x = approach(b.velocity.x, (ground || dy > 20) && adx > 10 ? e.dir * D.chase : 0, 500 * dt);
      if (onGround && e.atkCd <= 0 && sees && adx < 300 && adx > 40 && Math.abs(dy) < 36) { e.ai = 'wind'; e.aiUntil = now + T.windMs; e.hitP = false; Sfx.snort(); this.popAlert(e); }
    } else {
      if (onGround) { const ground = this.standAt(b.center.x + e.dir * (b.halfWidth + 4), b.bottom + 4), wall = e.dir > 0 ? b.blocked.right : b.blocked.left; if (!ground || wall) e.dir *= -1; }
      b.velocity.x = approach(b.velocity.x, e.dir * D.patrol, 400 * dt);
    }
    if (!fr) { const moving = Math.abs(b.velocity.x) > 6 && onGround; if (moving) e.animT += dt * Math.abs(b.velocity.x) / 16; fr = 'w' + (moving ? Math.floor(e.animT) % 4 : 0); }
    e.fr = fr;
  }

  // ------------------------------------------------------------- cluster mortar ----
  clusterBurst(x, y, vx, vy) {                                          // airburst: scatters bomblets over everything below
    const C = TUNE.CLUSTER;
    this.explode(x, y, C.shell); Sfx.clusterPop();
    for (let i = 0; i < C.bomblets; i++) {
      const b = this.spawnGrenade(x, y, 0, 'bomb'); if (!b) break;
      b.setVelocity(vx * 0.6 + Math.sign(vx || 1) * rand(-50, 170), Math.min(vy * 0.3, 60) + rand(-200, -40));   // mostly forward, not back on you
    }
  }
  // -------------------------------------------------------------- stake driver ----
  // A heavy stake: kills that leave a body carry it (up to 2) and nail it to the next wall; tough targets
  // just eat it. Pinned bodies dangle from the wall until they're blown apart or the wall breaks.
  spawnStake(x, y, a) {
    const s = this.stakes.getFirstDead(false); if (!s) return;
    const W = TUNE.STAKE;
    s.enableBody(true, x, y, true, true); s.body.setAllowGravity(false); s.body.setSize(4, 4, true);
    s.setVelocity(Math.cos(a) * W.speed, Math.sin(a) * W.speed); s.setRotation(a);
    Object.assign(s, { life: W.life, px: x, py: y, carry: [], hits: new Set() });
  }
  updateStakes(dt) {
    const W = TUNE.STAKE;
    for (const s of this.stakeList) {
      if (!s.active) continue;
      s.life -= dt; s.body.velocity.y += 140 * dt;                       // heavy: drops a touch
      const vx = s.body.velocity.x, vy = s.body.velocity.y, a = Math.atan2(vy, vx), ca = Math.cos(a), sa = Math.sin(a);
      s.setRotation(a);
      const n = Math.max(1, Math.ceil(Math.hypot(s.x - s.px, s.y - s.py) / 3));
      let stop = false;
      for (let i = 1; i <= n && !stop; i++) {
        const x = s.px + (s.x - s.px) * i / n, y = s.py + (s.y - s.py) * i / n;
        if (this.solidAt(x, y)) { this.stakeWall(s, x - ca * 2, y - sa * 2, Math.floor(x / TS), Math.floor(y / TS), a); stop = true; break; }
        const e = this.enemyAt(x, y, 1);
        if (e && !s.hits.has(e)) {
          s.hits.add(e);
          if (this.shieldBlocks(e, ca, y)) { this.fxSparks(x, y, 8, a + Math.PI, 1.2, [80, 240]); Sfx.clang(); e.ai = 'stagger'; e.aiUntil = this.time.now + 900; s.disableBody(true, true); stop = true; break; }
          this.stats.hits++;
          const hs = (isHumanoid(e) || e.kind === 'jet') && y < e.body.top + 5;
          this.fxBlood(x, y, 10, a, 0.7, [100, 300]); this.fxBlood(x, y, 4, a + Math.PI, 1, [40, 120]);
          this.lastRag = null;
          this.damageEnemy(e, W.damage * (hs ? TUNE.HEADSHOT : 1), ca, sa, 'stake', hs);
          if (e.alive) { e.body.velocity.x += ca * 220 * e.def.kb; s.disableBody(true, true); Sfx.squish(); stop = true; break; }   // stuck in something tough
          if (this.lastRag && this.lastRag.from === e && s.carry.length < W.carry) { s.carry.push({ rd: this.lastRag, pi: 1 }); Sfx.squish(); }
          continue;
        }
        if (s.carry.length < W.carry) {
          const rh = this.ragAt(x, y, 1);
          if (rh && !s.carry.some(c => c.rd === rh.rd)) { rh.rd.pin = null; s.carry.push({ rd: rh.rd, pi: rh.pi }); this.hitRagdoll(rh.rd, x, y, 6, ca, sa, 'stake', rh.pi); }
        }
        this.propHitAt(x, y, ca, sa);
      }
      if (stop) continue;
      s.carry.forEach((c, j) => {                                         // drag the skewered along
        if (c.rd.gone) return;
        const p = c.rd.pts[c.pi]; p.x = s.x - ca * (4 + j * 7); p.y = s.y - sa * (4 + j * 7); p.vx = vx; p.vy = vy; c.rd.asleep = false; c.rd.stillT = 0;
      });
      if (Math.random() < 0.5) this.fx.emit(s.x - ca * 8, s.y - sa * 8, { n: 1, speed: [0, 0], life: [0.06, 0.1], size: [2, 1], cols: [0xffffff, 0xb8c2cc], add: true });
      if (s.life <= 0) { s.disableBody(true, true); continue; }
      s.px = s.x; s.py = s.y;
    }
  }
  stakeWall(s, x, y, tx, ty, a) {
    const d = this.stakeDecals[this.stakeCursor]; this.stakeCursor = (this.stakeCursor + 1) % this.stakeDecals.length;
    for (const rd of d.pinned) if (rd.pin && rd.pin.decal === d) { rd.pin = null; rd.asleep = false; }   // recycled: whatever hung there drops

  // ----------------------------------------------------------------- prox mines ----

    const m = this.mines.getFirstDead(false); if (!m) return;
    const a = this.aim, ca = Math.cos(a), sa = Math.sin(a), sx = this.shoulder.x, sy = this.shoulder.y;

    m.setVelocity(ca * M.speed + this.player.body.velocity.x * 0.3, sa * M.speed - M.lift); m.setRotation(0);
    Object.assign(m, { stuck: false, armT: M.arm, armed: false, trig: -1, host: null, born: now, blinkT: 0, led: false, px: m.x, py: m.y });

  updateMines(dt) {

        if (!m.host.alive) { m.host = null; m.stuck = false; b.moves = true; b.setAllowGravity(true); }
        else { b.reset(m.host.x + m.hox, m.host.y + m.hoy); m.trig -= dt; if (m.trig <= 0) { this.detonateMine(m); continue; } }
      }

        if (hit || b.blocked.down || b.blocked.left || b.blocked.right || b.blocked.up || (b.velocity.y > 0 && this.standAt(m.x, m.y + 3))) {
          if (hit) b.reset(hit.x, hit.y);
          b.setVelocity(0, 0); b.setAllowGravity(false); b.moves = false; m.stuck = true;
          m.setRotation(this.standAt(m.x, m.y + 4) ? 0 : this.solidAt(m.x, m.y - 4) ? Math.PI : this.solidAt(m.x - 4, m.y) ? Math.PI / 2 : -Math.PI / 2);

        if (!this.standAt(m.x, m.y + 4) && !this.solidAt(m.x, m.y - 4) && !this.solidAt(m.x - 4, m.y) && !this.solidAt(m.x + 4, m.y)) { m.stuck = false; b.moves = true; b.setAllowGravity(true); }   // its wall got blown away
      }

  // ------------------------------------------------------------------- sapper ----
  // Runs in under your feet, kneels, drops a 2 s satchel charge and legs it. The charge wrecks the floor.
  // Shoot the charge to cook it off early, or kick it back at them.
  thinkSapper(e, dt, now, c) {
    const T = TUNE.SAPPER;
    e.repathT -= dt; e.plantCd -= dt;
    switch (e.ai) {
      case 'idle': this.lookAround(e, dt); return 'hold';
      case 'dodge': if (c.onGround && now > e.aiUntil + 120) { e.ai = 'hunt'; e.repathT = 0; } return 'free';
      case 'plant':
        if (now >= e.aiUntil) { this.plantCharge(e.x + e.dir * 6, e.body.bottom - 4, T.fuse); e.ai = 'flee'; e.aiUntil = now + 2600; e.plantCd = T.cd; this.pickPosition(e, 'retreat'); Sfx.radio(); }
        return 'hold';
      case 'flee': if (now > e.aiUntil) { e.ai = 'hunt'; e.repathT = 0; } return 'path';
      default: {
        if (!c.alive || now - e.lkT > 6000) { e.ai = 'idle'; e.aggro = false; return 'hold'; }
        if (c.onGround && !e.navAir && e.plantCd <= 0 && c.dist < T.plantRange && Math.abs(c.dy) < 40) { e.ai = 'plant'; e.aiUntil = now + T.plantMs; e.body.velocity.x = 0; Sfx.beep(); return 'hold'; }
        if (c.onGround && !e.navAir && e.repathT <= 0) { e.repathT = 0.7; this.pathTo(e, navBelow(e.lkx, e.lky - 4), 120); }

      }

  }
  plantCharge(x, y, fuse) {

    c.setVelocity(0, 0);

    Sfx.clunk(0.8);
  }
  detonateCharge(c) { const x = c.x, y = c.y; c.disableBody(true, true); c.clearTint(); this.explode(x, y, TUNE.SAPPER.blast); }
  updateCharges(dt) {
    for (const c of this.chargeList) {
      if (!c.active) continue;
      const b = c.body, sp = Math.abs(b.velocity.x) + Math.abs(b.velocity.y);
      if (c.kicked && c.prevV > 150 && (b.blocked.left || b.blocked.right || b.blocked.up || b.blocked.down)) { this.detonateCharge(c); continue; }   // punted charges go off on impact
      c.prevV = sp;
      c.fuse -= dt; c.beepT -= dt;
      const k = c.fuse / c.max;
      if (c.beepT <= 0) { c.beepT = Math.max(0.07, 0.45 * k); Sfx.beep(); this.spawnLight(c.x, c.y - 2, 'glow', 0xff2010, 0.5, 0.9, 0.9, 0.08); }
      if (Math.floor(c.fuse * (k < 0.3 ? 20 : 6)) % 2) c.setTint(0xff8070); else c.clearTint();
      if (c.fuse <= 0) this.detonateCharge(c);
    }
  }

  // ----------------------------------------------------------------- jet trooper ----
  // Hovers off your shoulder on a jetpack, swaps sides every few seconds, 0.35 s glint then a 4-round burst.
  // Kill it cleanly and the pack goes haywire: it careens round the room, smashing its squad, then blows.
  updateJet(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, T = TUNE.JET, pb = this.player.body;
    if (alive && !e.aggro && (e.sees || dist < 120) && dist < e.def.sight) { this.alertEnemy(e, now); Sfx.chirp(); }
    if (e.aggro && e.sees) e.aggroT = Math.max(e.aggroT, 4);
    if (e.aggro && (e.aggroT <= 0 || !alive)) e.aggro = false;
    let tx, ty;
    if (e.aggro && alive) {
      e.sideT -= dt; if (e.sideT <= 0) { e.sideT = rand(2.5, 4.5); e.side *= -1; }
      tx = pb.center.x + e.side * T.range + Math.sin(e.t * 1.7) * 30;
      ty = pb.top - T.height + Math.sin(e.t * 2.3) * 14;
      for (let i = 0; i < 5 && this.solidAt(tx, ty); i++) { tx += (pb.center.x - tx) * 0.3; ty += 10; }
      if (e.ai !== 'burst') e.aimA = Math.atan2(pb.center.y - e.y, pb.center.x - e.x);
      e.dir = dx >= 0 ? 1 : -1;
    } else {
      tx = e.homeX + Math.sin(e.t * 0.4) * 50; ty = e.homeY + Math.sin(e.t * 1.1) * 10;
      if (Math.abs(b.velocity.x) > 8) e.dir = b.velocity.x > 0 ? 1 : -1;
      e.aimA = e.dir > 0 ? 0.3 : Math.PI - 0.3;
    }
    if (e.stunT <= 0) {
      const k = Math.min(1, dt * 2.4);
      b.velocity.x += (clamp((tx - b.center.x) * 2, -T.speed, T.speed) - b.velocity.x) * k;
      b.velocity.y += (clamp((ty - b.center.y) * 2, -T.speed * 0.8, T.speed * 0.8) - b.velocity.y) * k;
    } else b.velocity.y += 300 * dt;                                      // stunned: loses thrust and drops
    e.fireCd -= dt;
    if (e.ai === 'tell') { if (now >= e.aiUntil) { e.ai = 'burst'; e.shotsLeft = T.burst; e.shotT = 0; } }
    else if (e.ai === 'burst') {
      e.shotT -= dt;
      if (e.shotT <= 0 && e.shotsLeft > 0) { this.jetShoot(e); e.shotsLeft--; e.shotT = T.gap; }
      if (e.shotsLeft <= 0) { e.ai = 'fly'; e.fireCd = rand(1.3, 2); }
    } else if (e.aggro && alive && e.fireCd <= 0 && e.sees && dist < 300) { e.ai = 'tell'; e.aiUntil = now + T.tellMs; e.aimA = this.leadAngle(e, T.bulletSpeed); Sfx.charge(0.4); }
    if (Math.random() < 0.8) this.fx.emit(e.x - e.dir * 4, e.y + 9, { n: 1, angle: Math.PI / 2, spread: 0.4, speed: [60, 130], life: [0.08, 0.18], size: [3, 1], cols: [0xffffff, 0x9adcff, 0x4a8aff], add: true });
    if (Math.random() < 0.12) this.fxSmoke(e.x - e.dir * 4, e.y + 11, 1, 0.5);
    e.recoil = Math.max(0, e.recoil - 30 * dt);
    e.fr = Math.floor(e.t * 6) % 2 ? 'j1' : 'j0';
  }
  jetShoot(e) {
    const T = TUNE.JET, a = e.aimA + rand(-4, 4) * DEG, mx = e.x + Math.cos(a) * 14, my = e.y + 1 + Math.sin(a) * 14;
    e.recoil = 2; Sfx.eshot(); this.spawnLight(mx, my, 'glow', 0xffe080, 0.6, 1, 0.9, 0.06);
    if (this.solidAt(mx, my) || !this.los(e.x, e.y, mx, my)) return;
    const bl = this.ebullets.getFirstDead(false); if (!bl) return;
    bl.setTexture('ebullet'); bl.enableBody(true, mx, my, true, true); bl.body.setAllowGravity(false); bl.body.setSize(3, 3, true);
    bl.setRotation(a); bl.setVelocity(Math.cos(a) * T.bulletSpeed, Math.sin(a) * T.bulletSpeed);
    Object.assign(bl, { life: 1.4, px: mx, py: my, ang: a, dmg: T.damage, snipe: false });
  }
  spawnHaywire(e, dx) {
    const h = this.haywires.getFirstDead(false); if (!h) return false;
    h.setTexture('jet', 'j0').enableBody(true, e.x, e.y, true, true);
    h.body.setSize(10, 14, true); h.body.setAllowGravity(true); h.body.setBounce(0.55, 0.55);
    h.setVelocity(e.body.velocity.x + dx * 120, e.body.velocity.y - 120); h.setTint(0xb0b0b0); h.setFlipX(e.dir < 0);
    Object.assign(h, { t: rand(1.1, 1.7), heading: -Math.PI / 2 + rand(-1.2, 1.2), turnT: 0, hitSet: new Set(), spin: rand(-12, 12), hitP: false });

    Sfx.sputter();

  }
  updateHaywires(dt) {
    const pb = this.player.body;
    for (const h of this.haywireList) {
      if (!h.active) continue;
      h.t -= dt; h.turnT -= dt;
      if (h.turnT <= 0) { h.turnT = rand(0.08, 0.22); h.heading += rand(-1.6, 1.6); Sfx.sputter(); }
      const bv = h.body.velocity;
      bv.x = clamp(bv.x + Math.cos(h.heading) * 1100 * dt, -360, 360); bv.y = clamp(bv.y + Math.sin(h.heading) * 1100 * dt, -360, 360);
      h.rotation += h.spin * dt;

      this.fx.emit(ex, ey, { n: 2, angle: h.heading + Math.PI, spread: 0.5, speed: [60, 160], life: [0.1, 0.25], size: [3, 1], cols: [0xffffff, 0xffe46a, 0xff8a1f, 0x9adcff], add: true });
      if (Math.random() < 0.4) this.fxSmoke(ex, ey, 1, 0.6);
      if (Math.random() < 0.25) this.fxSparks(h.x, h.y, 2);
      if (Math.random() < 0.3) this.fxBlood(h.x, h.y, 1);
      h.glow.setPosition(ex, ey).setScale(0.6 + Math.random() * 0.4);
      for (const o of this.enemies.getChildren()) {                       // smashes into its old squad
        if (!o.alive || h.hitSet.has(o) || o.kind === 'boss') continue;
        const ob = o.body;
        if (h.x > ob.left - 4 && h.x < ob.right + 4 && h.y > ob.top - 4 && h.y < ob.bottom + 4) { h.hitSet.add(o); this.damageEnemy(o, 20, Math.sign(bv.x) || 1, -0.5, 'kick'); Sfx.kickHit(); }
      }

  }
  haywireBoom(h) {
    const x = h.x, y = h.y, D = ENEMY.jet; h.disableBody(true, true); h.glow.setVisible(false); h.clearTint();
    for (let i = 0; i < 12; i++) this.spawnGib(i < D.gibs.length ? D.gibs[i] : pick(D.gibs), x + rand(-4, 4), y + rand(-4, 4), rand(-220, 220), rand(-320, -100));

  // ---------------------------------------------------------------- brood mother ----
  // Slow, fat, and full of ticks: swells up (0.7 s) and births a pair every few seconds; bursts into more.
  updateBrood(e, dt, now, dx, dy, dist, alive) {
    const b = e.body, D = e.def, T = TUNE.BROOD, onGround = b.blocked.down || b.touching.down;
    if (alive && !e.aggro && (e.sees || dist < 160) && dist < D.sight) this.alertEnemy(e, now);
    if (e.aggro && e.sees) e.aggroT = Math.max(e.aggroT, 5);
    if (e.aggro && (e.aggroT <= 0 || !alive)) e.aggro = false;
    e.atkCd -= dt;
    if (e.ai === 'birth') {
      b.velocity.x = approach(b.velocity.x, 0, 300 * dt);
      e.fr = 1 - (e.aiUntil - now) / T.tellMs > 0.55 ? 'sw2' : 'sw';
      if (Math.random() < 0.3) this.fxBlood(e.x + rand(-8, 8), b.top + 4, 1, -Math.PI / 2, 1, [20, 60]);
      if (now >= e.aiUntil) { this.broodBirth(e.x, e.body.top + 8, e.dir, T.spawn, e); e.ai = 'crawl'; e.atkCd = T.cd; }
      return;

      const ground = this.standAt(b.center.x + e.dir * (b.halfWidth + 4), b.bottom + 4);
      b.velocity.x = approach(b.velocity.x, ground && Math.abs(dx) > 30 ? e.dir * T.speed : 0, 200 * dt);
      const mine = this.enemies.getChildren().filter(o => o.alive && o.mother === e).length;
      if (onGround && e.atkCd <= 0 && mine < T.max) { e.ai = 'birth'; e.aiUntil = now + T.tellMs; Sfx.growl(true); }
    } else {

      b.velocity.x = approach(b.velocity.x, e.dir * T.speed * 0.6, 200 * dt);
    }
    const moving = Math.abs(b.velocity.x) > 4; if (moving) e.animT += dt * 5;
    e.fr = 'w' + (moving ? Math.floor(e.animT) % 4 : 0);
  }
  broodBirth(x, y, dir, n, mother) {
    for (let i = 0; i < n; i++) {
      const t = this.spawnEnemy('tick', clamp(Math.floor(x / TS), 2, MAP_W - 3), clamp(Math.floor(y / TS), 2, MAP_H - 3));
      t.body.reset(x + dir * 8 + rand(-5, 5), y); t.body.setVelocity(dir * rand(60, 200) + rand(-60, 60), rand(-300, -200));

  }

  // ------------------------------------------------------------- props: lamps & gas ----
  propHitAt(x, y, ca, sa) {                                            // shots hit the scenery too; true if something took it
    for (const L of this.lamps) if (!L.falling && !L.dead && ((Math.abs(x - L.x) < 7 && Math.abs(y - L.y) < 6) || (Math.abs(x - L.x) < 2 && y > 2 * TS && y < L.y - 3))) { this.dropLamp(L); return true; }
    for (const k of this.canisterList) if (k.active && k.state === 'idle' && Math.abs(x - k.x) < 5 && Math.abs(y - k.y) < 8) {
      const h = Math.atan2(sa, ca); this.igniteCanister(k, h + (Math.cos(h) >= 0 ? -0.9 : 0.9) + rand(-0.3, 0.3)); return true;
    }
    for (const c of this.chargeList) if (c.active && Math.abs(x - c.x) < 5 && Math.abs(y - c.y) < 5) { this.detonateCharge(c); BUS.emit('callout', 'COOKED OFF'); this.addStyle(40); return true; }
    for (const m of this.mineList) if (m.active && Math.abs(x - m.x) < 4 && Math.abs(y - m.y) < 4) { this.detonateMine(m); return true; }
    return false;
  }
  propSweep(x0, y0, x1, y1, ca, sa) {
    for (let i = 1; i <= 3; i++) if (this.propHitAt(x0 + (x1 - x0) * i / 3, y0 + (y1 - y0) * i / 3, ca, sa)) return true;
    return false;
  }
  dropLamp(L) {
    if (L.falling || L.dead) return;
    L.falling = true; L.vy = -40; L.spin = rand(-6, 6); L.hitP = false; L.hits = new Set();
    this.lvlCtx.clearRect(L.x, 2 * TS, 1, Math.max(0, L.y - 3 - 2 * TS)); this.lvlDirty = true;   // the chain snaps
    for (let i = 0; i < 3; i++) this.spawnGib('g_bar', L.x, rand(2 * TS, L.y - 4), rand(-60, 60), rand(-80, 0), 'metal');
    this.fxSparks(L.x, L.y - 4, 10, -Math.PI / 2, 2, [60, 220]); Sfx.clang(); Sfx.snap();
    this.spawnLight(L.x, L.y, 'glow', 0xffe0a0, 1.5, 3, 0.9, 0.15);
  }
  updateLamp(L, dt) {

    L.img.setPosition(L.x, L.y).setRotation(L.img.rotation + L.spin * dt);
    const fl = Math.random() < 0.3 ? 0.2 : 1;
    L.gl.setPosition(L.x, L.y + 3).setAlpha(0.5 * fl); L.cone.setPosition(L.x, L.y + 3).setRotation(L.img.rotation).setAlpha(0.16 * fl);
    if (L.vy > 120) {
      for (const e of this.enemies.getChildren()) {
        if (!e.alive || L.hits.has(e) || e.kind === 'boss') continue;
        const eb = e.body;

      case 'reveal':

  // ---------------------------------------------------------------- post FX ----

    try {

  // ----------------------------------------------------------------- glaive ----
  // Thrown hooked ring: cuts on the way out and on the way back, and you catch it to throw again at once.

    Object.assign(g, { on: true, x, y, vx: ca * T.speed, vy: sa * T.speed, state: 'out', dist: 0, bsp: 0, hoverT: T.hover, trailT: 0, whirT: 0 });
    g.hits.clear();
    this.nextFire = now + T.cooldown; this.lastShotT = now; this.stats.shots++;
    this.makeNoise(this.player.x, this.player.y, 210, true);
    this.recoil = 3; Sfx.glaive();
    this.fxSparks(x, y, 4, a, 0.8, [60, 180]); this.spawnLight(x, y, 'glow', 0x46e6ff, 0.8, 1.6, 0.8, 0.12);
    this.shake(40, 0.0015); this.addKick(-ca * 1.5, -sa * 1.5);

  updateGlaive(dt, now) {
    const g = this.glaive, T = TUNE.GLAIVE;

    const pb = this.player.body, px = pb.center.x, py = pb.center.y - 2;
    g.spin += dt * (g.state === 'hover' ? 40 : 26);
    if (g.state === 'out') {
      const f = Math.max(0.12, 1 - Math.pow(g.dist / T.range, 2)), nx = g.x + g.vx * f * dt, ny = g.y + g.vy * f * dt;
      g.dist += Math.hypot(nx - g.x, ny - g.y);

      if (hit) {
        g.x = hit.x; g.y = hit.y;
        const tx = Math.floor(nx / TS), ty = Math.floor(ny / TS);
        if (TILE_HP[this.tileAt(tx, ty)]) this.damageTile(tx, ty, 20);
        this.fxSparks(g.x, g.y, 8, Math.atan2(-g.vy, -g.vx), 1.6, [80, 240]); Sfx.clang(0.5); this.shake(40, 0.002);
        g.state = this.glaiveHold ? 'hover' : 'back'; g.hoverT = T.hover;  // bites into the wall if you're still holding
      } else { g.x = nx; g.y = ny; }
      if (g.state === 'out' && g.dist >= T.range) { g.state = this.glaiveHold ? 'hover' : 'back'; g.hoverT = T.hover; }
    } else if (g.state === 'hover') {
      g.hoverT -= dt;
      if (!this.glaiveHold || g.hoverT <= 0) g.state = 'back';
      if ((g.tileT = (g.tileT || 0) - dt) <= 0) {                        // chews through crates and girders it's pressed against
        g.tileT = T.grindMs / 1000;
        for (const [ox, oy] of [[(Math.sign(g.vx) || 1) * 7, 0], [0, 7], [0, -7]]) {
          const tx = Math.floor((g.x + ox) / TS), ty = Math.floor((g.y + oy) / TS);
          if (TILE_HP[this.tileAt(tx, ty)]) { this.damageTile(tx, ty, 8); this.fxSparks(g.x + ox, g.y + oy, 2, Math.atan2(-oy, -ox), 1.2, [40, 140]); break; }
        }
      }
      else if (this.aimMode === 'mouse' && this.aimPt) {                 // steer it toward the cursor while it grinds

      if (d < 12) {                                                      // caught: ready to throw again at once

      g.hits.set(e, now + (grind ? T.grindMs : 280));
      const ix = g.state === 'back' ? Math.sign(px - g.x) || 1 : Math.sign(g.vx) || 1, hs = isHumanoid(e) && g.y < b.top + 5;
      if (!grind && this.shieldBlocks(e, ix, g.y)) { this.fxSparks(g.x, g.y, 6, ix > 0 ? Math.PI : 0, 1.2); Sfx.clang(0.5); if (g.state === 'out') g.state = 'back'; continue; }
      this.stats.hits++;
      if (e.def.molten) this.fxSparks(g.x, g.y, 4); else this.fxBlood(g.x, g.y, grind ? 3 : 8, Math.atan2(g.vy, g.vx), 1.6, [60, 240]);
      this.damageEnemy(e, (grind ? T.grind : T.damage) * (hs ? TUNE.HEADSHOT : 1), ix, 0, 'glaive', hs);

    if (rh && (g.hits.get(rh.rd) || 0) <= now) { g.hits.set(rh.rd, now + (grind ? T.grindMs : 250)); this.hitRagdoll(rh.rd, g.x, g.y, grind ? T.grind : T.damage, g.vx / sp, -0.2, 'saw', rh.pi); }
    for (const list of [this.ebulletList, this.boltList]) for (const b of list) if (b.active && Math.abs(b.x - g.x) < 8 && Math.abs(b.y - g.y) < 8) { const x = b.x, y = b.y; b.disableBody(true, true); this.fxSparks(x, y, 5); Sfx.tink(0.7); this.addStyle(8); }
    this.propHitAt(g.x, g.y, g.vx / sp, g.vy / sp);
    for (const gb of this.gibList) if (gb.active && Math.abs(gb.x - g.x) < 7 && Math.abs(gb.y - g.y) < 7) { gb.body.velocity.x = g.vx * 0.5 + rand(-80, 80); gb.body.velocity.y = -rand(100, 220); gb.body.angularVelocity = rand(-1200, 1200); }
    this.glaiveImg.setPosition(Math.round(g.x), Math.round(g.y)).setRotation(g.spin);
    this.glaiveGlow.setPosition(g.x, g.y).setScale(grind ? 1.1 + Math.random() * 0.2 : 0.8);
    if ((g.trailT -= dt) <= 0) { g.trailT = 0.03; this.spawnLight(g.x, g.y, 'glaive', 0x46e6ff, 1, 0.9, 0.45, 0.12); }
    if (grind && Math.random() < 0.5) this.fxSparks(g.x, g.y + 4, 1, Math.PI / 2, 2, [40, 140]);
    if ((g.whirT -= dt) <= 0) { g.whirT = grind ? 0.09 : 0.14; Sfx.whirr(clamp(1 - Math.hypot(g.x - px, g.y - py) / 400, 0.2, 1)); }
  }

  floorBelow(x, y, max = 320) {                                         // top of the first standable tile at or below (x, y)
    for (let yy = Math.max(0, y); yy < y + max && yy < LH; yy += 4) if (this.standAt(x, yy)) return Math.floor(yy / TS) * TS;
    return null;
  }

  // --------------------------------------------------------------- slagling ----
  // Hopping molten blob: big ones split into two mid ones, mids into two small ones (7 kills per big slagling).
  // Fireproof; frozen ones shatter without splitting.

    const b = e.body, D = e.def, T = TUNE.SLAGLING, onGround = b.blocked.down || b.touching.down;

        e.landT = 0.16;

  // --------------------------------------------------------------- burrower ----

  // -------------------------------------------------------------- harpooner ----
  // Dock brute with a chain harpoon: 0.6 s windup (yellow sight line, locks for the last 30%), then a 430 px/s
  // throw. Hooked, you get reeled in for a 16-dmg slash. Kick or dash to snap the chain, or hurt it for 25 to
  // make it let go.
  thinkHarpooner(e, dt, now, c) {
    const T = TUNE.HARPOON, pb = this.player.body;
    e.fireCd -= dt; e.repickT -= dt;
    if (e.hk) { if (c.onGround) e.body.velocity.x = approach(e.body.velocity.x, 0, 1600 * dt); return 'hold'; }   // plants its feet while the line is out
    switch (e.ai) {
      case 'idle': this.lookAround(e, dt); return 'hold';
      case 'dodge': if (c.onGround && now > e.aiUntil + 120) { e.ai = 'engage'; e.repickT = 0; } return 'free';
      case 'windup':
        e.dir = c.dx >= 0 ? 1 : -1;
        if (now < e.aiUntil - T.windMs * 0.3) e.aimA = Math.atan2(pb.center.y - (e.y - 8), pb.center.x + pb.velocity.x * 0.15 - e.x);
        if (now >= e.aiUntil) { this.throwHarpoon(e); e.ai = 'throw'; e.aiUntil = now + 300; e.fireCd = T.cd * rand(0.9, 1.15); }
        return 'hold';

  // ----------------------------------------------------------------- storm coil ----

  // ---------------------------------------------------------------- flak cannon ----

    if (e.aggro && e.sees) e.aggroT = Math.max(e.aggroT, 5);
    let tx = e.homeX + Math.sin(e.t * 0.5) * 30, ty = e.homeY + Math.sin(e.t * 1.3) * 8;
    if (e.aggro && alive) { tx = pb.center.x + (e.x < pb.center.x ? -T.keep : T.keep); ty = pb.top - 70 + Math.sin(e.t * 1.1) * 12; if (this.solidAt(tx, ty)) ty += 20; }

    if (this.ovGradeShown) { this.gradePop = Math.max(0, this.gradePop - dt); this.ovGrade.setScale(14 + this.gradePop * 25); }
  }
  setOverlay(on) {
    this.overOn = on;
    const g = this.ovG; g.clear();
    if (on) {
      g.fillStyle(0x000000, 0.7); g.fillRect(0, 126, VIEW_W, 312);
      g.fillStyle(0xff8a1f, 1); g.fillRect(0, 126, VIEW_W, 2); g.fillRect(0, 436, VIEW_W, 2);
      g.fillStyle(0x06070a, 0.9); g.fillRect(760, 194, 124, 140); g.lineStyle(2, 0x3a424d, 1); g.strokeRect(761, 195, 122, 138);
    }
    [this.ovTitle, this.ovStat1, this.ovStat2, this.ovStat3, this.ovStat4, this.ovScore, this.ovBest, this.ovGradeLbl, this.ovPrompt, this.ovSub].forEach(o => o.setVisible(on));
    this.ovGrade.setVisible(false);
    [this.lblMines, this.lblSentry, this.lblWeapon].forEach(o => o.setVisible(!on));   // they sit inside the results strip
  }
  update(time, delta) {
    const dt = Math.min(delta, 50) / 1000; this.hudFrame++;
    const gsr = this.scene.get('Game');
    if (gsr && gsr.sys.isActive()) {                                     // sentry status + rampage timer, read from the game
      const st = gsr.sentry ? 'T SENTRY ' + Math.ceil(gsr.sentry.t) + 'S' : gsr.time.now >= gsr.sentryReadyAt ? 'T SENTRY READY' : 'T SENTRY ' + Math.ceil((gsr.sentryReadyAt - gsr.time.now) / 1000);
      if (st !== this.sentTxt) { this.sentTxt = st; this.lblSentry.setStyle({ color: gsr.sentry ? '#46e6ff' : st.endsWith('READY') ? '#5cff7a' : '#7d8896' }).setText(st); }
      this.rampA = Math.max(0, (gsr.rampageUntil || 0) - gsr.time.now);
    } else this.rampA = 0;
    this.lblRamp.setVisible(this.rampA > 0 && !this.overOn).setAlpha(Math.floor(time / 150) % 2 ? 1 : 0.55);
    this.dispHp = this.dispHp > this.hp ? Math.max(this.hp, this.dispHp - 30 * dt) : this.hp;
    this.hurtA = Math.max(0, this.hurtA - dt * 1.8); this.healA = Math.max(0, this.healA - dt * 2);
    this.flashA = Math.max(0, this.flashA - dt * 2.2); this.panelShake = Math.max(0, this.panelShake - dt);
    if (gsr && !this.pauseOn) {                                          // hit-direction markers fade; dash meter refills
      for (let i = this.dirs.length - 1; i >= 0; i--) if ((this.dirs[i].t -= dt) <= 0) this.dirs.splice(i, 1);
      this.dashK = clamp(1 - ((gsr.dashReady || 0) - gsr.time.now) / (TUNE.DASH.cd * 1000), 0, 1);
    }
    this.draw(time);
    this.drawSplats(dt);
    this.drawBoss(dt);
    this.drawWaveCard(dt);
    this.drawIndicators(gsr, time);
    if (this.pauseOn) this.drawPause(time);
    // hit marker: four ticks round the crosshair; red + wider on a kill, yellow ring on a headshot
    const hg = this.hmG; hg.clear();
    if (this.hmT > 0 && this.aimMode === 'mouse') {
      this.hmT -= dt;
      const p = this.input.activePointer, cx = Math.round(p.x), cy = Math.round(p.y), grow = this.hmKill ? 5 : 2;
      const col = this.hmHead ? 0xffe14a : this.hmKill ? 0xff3a2a : 0xffffff;
      for (const [c, o] of [[0x000000, 1], [col, 0]]) {
        hg.fillStyle(c, 1);
        for (const [sx, sy] of [[1, 1], [1, -1], [-1, 1], [-1, -1]]) for (let i = 0; i < 3; i++) {
          const d = 9 + i * 2 + grow; hg.fillRect(cx + sx * d - 1 + o, cy + sy * d - 1 + o, 2, 2);
        }
      }
      if (this.hmHead) { hg.lineStyle(2, 0xffe14a, Math.min(1, this.hmT * 4)); hg.strokeCircle(cx, cy, 20 + (0.32 - this.hmT) * 30); }
    } else { this.hmT = Math.max(0, this.hmT - dt); }
    if (this.hmT <= 0) this.hmHead = false;
    if (gsr && gsr.sys.isActive() && this.aimMode === 'mouse' && gsr.state !== 'dead') {   // crosshair readouts: lance charge ring, hornet lock pips
      const p = this.input.activePointer, cx = Math.round(p.x), cy = Math.round(p.y), wid = WEAPONS[gsr.weapon].id;
      if (wid === 'lance' && gsr.lanceOn) {
        const c = gsr.lanceCharge, n = 16, lit = Math.round(n * c), full = c >= 1, blink = full && Math.floor(time / 70) % 2;
        for (let i = 0; i < n; i++) {
          const a = -Math.PI / 2 + i / n * Math.PI * 2, x = Math.round(cx + Math.cos(a) * 18), y = Math.round(cy + Math.sin(a) * 18);
          hg.fillStyle(0x000000, 0.6).fillRect(x - 2, y - 2, 4, 4);
          hg.fillStyle(i < lit ? (blink ? 0xffffff : full ? 0xffe080 : 0xff8a20) : 0x3a2010, 1).fillRect(x - 1, y - 1, 2, 2);
        }
      } else if (wid === 'hornet' && (gsr.locks.length || gsr.hornetHeld)) {
        for (let i = 0; i < TUNE.HORNET.maxLocks; i++) { const x = cx - 17 + i * 6, y = cy + 16; hg.fillStyle(0x000000, 0.7).fillRect(x - 1, y - 1, 6, 6); hg.fillStyle(i < gsr.locks.length ? 0xff5a2a : 0x3a2a24, 1).fillRect(x, y, 4, 4); }
      }
    }
    // style rank: read straight from the game scene
    const gs = this.scene.get('Game'), st = gs && gs.style;
    if (st) {
      const r = st.rank, R = STYLE_RANKS[r];
      if (r !== this.shownRank) { this.shownRank = r; this.lblRank.setStyle({ color: R.c }).setText(R.n); }
      this.styleA += ((st.pts > 4 && !this.overOn ? 1 : 0) - this.styleA) * Math.min(1, dt * 5);
      this.rankPop = Math.max(0, this.rankPop - dt);
      this.lblRank.setAlpha(this.styleA).setScale(6 + this.rankPop * 10); this.lblStyleT.setAlpha(this.styleA * 0.9);
      this.styleFrac = r + 1 < STYLE_RANKS.length ? clamp((st.pts - R.t) / (STYLE_RANKS[r + 1].t - R.t), 0, 1) : 1;
    }
    const age = (time - this.t0) / 1000, ha = age < 10 ? 0.9 : Math.max(0, 0.9 - (age - 10) * 0.3);   // gone after 13 s: the strip sits right over the floor you fight on
    this.hint1.setAlpha(ha); this.hint2.setAlpha(ha);
    const p = this.input.activePointer;
    this.xhair.setVisible(this.aimMode === 'mouse').setPosition(Math.round(p.x), Math.round(p.y));
    if (this.overOn) { this.ovPrompt.setAlpha(Math.floor(time / 400) % 2 ? 1 : 0.35); this.tallyOver(dt); }
    this.drawWheel(gsr);
    if (this.countPulse > 0) { this.countPulse -= dt; this.lblCount.setScale(4 + Math.max(0, this.countPulse) * 6); }
  }
  drawBoss(dt) {
    const lg = this.lbG; lg.clear();
    if (this.lbT > 0) {                                                 // cinematic bars + title card
      this.lbT -= dt;
      const k = clamp(Math.min((2.8 - this.lbT) / 0.35, this.lbT / 0.35), 0, 1), h = Math.round(64 * k);
      lg.fillStyle(0x000000, 1); lg.fillRect(0, 0, VIEW_W, h); lg.fillRect(0, VIEW_H - h, VIEW_W, h);
      const ta = clamp(Math.min((2.8 - this.lbT - 0.3) / 0.3, this.lbT / 0.4), 0, 1);
      this.lbTitle.setVisible(ta > 0).setAlpha(ta).setScale(8 + (1 - ta) * 3); this.lbSub.setVisible(ta > 0).setAlpha(ta);
    } else { this.lbTitle.setVisible(false); this.lbSub.setVisible(false); }
    const gs = this.scene.get('Game'), b = gs && gs.boss;
    if (b && b.alive && this.lbT < 2.2) {                                // boss health bar, white trail on damage, phase notches
      const frac = clamp(b.hp / b.def.hp, 0, 1);
      this.bossDisp = this.bossDisp > frac ? Math.max(frac, this.bossDisp - dt * 0.35) : frac;
      const g = this.g, x = 336, y = 18, w = 408;
      g.fillStyle(0x06070a, 0.85); g.fillRect(x - 4, y - 4, w + 8, 22);
      g.fillStyle(0x3a2010, 1); g.fillRect(x, y, w, 14);
      g.fillStyle(0xffffff, 0.9); g.fillRect(x, y, Math.round(w * this.bossDisp), 14);
      g.fillStyle(frac > 0.66 ? 0xff8a20 : frac > 0.33 ? 0xff5a20 : 0xff2a2a, 1); g.fillRect(x, y, Math.round(w * frac), 14);
      g.fillStyle(0xffffff, 0.3); g.fillRect(x, y, Math.round(w * frac), 3);
      g.fillStyle(0x000000, 1); g.fillRect(x + Math.round(w * 0.66), y, 2, 14); g.fillRect(x + Math.round(w * 0.33), y, 2, 14);
      this.bossName.setVisible(true);
    } else this.bossName.setVisible(false);
  }
  drawSplats(dt) {
    const g = this.splatG; g.clear();
    for (let i = this.splats.length - 1; i >= 0; i--) {
      const s = this.splats[i]; s.t += dt; s.drip = Math.min(s.dripMax, s.drip + dt * 14);
      if (s.t >= s.life) { this.splats.splice(i, 1); continue; }
      const a = s.a * Math.min(1, 2 - 2 * s.t / s.life);
      g.fillStyle(0x6a0808, a); g.fillRect(s.x - s.r / 2, s.y - s.r / 2, s.r, s.r * 0.8);
      for (const [ox, oy, w] of s.sat) g.fillRect(s.x + ox - w / 2, s.y + oy - w / 2, w, w);
      g.fillRect(s.x - 2, s.y, 4, Math.round(s.drip / 4) * 4);
      g.fillStyle(0x9a1414, a * 0.7); g.fillRect(s.x - s.r / 4, s.y - s.r / 4, s.r / 2, s.r / 3);
    }
  }
  draw(time) {
    const g = this.g; g.clear();
    const panel = (x, y, w, h) => {
      g.fillStyle(0x06070a, 0.78); g.fillRect(x, y, w, h);
      g.fillStyle(0x3a424d, 1); g.fillRect(x, y, w, 2);
      g.fillStyle(0x1c2027, 1); g.fillRect(x, y + h - 2, w, 2); g.fillRect(x, y, 2, h); g.fillRect(x + w - 2, y, 2, h);
    };
    panel(14, 10, 302, 64);
    const frac = this.hp / TUNE.PLAYER_HP, dfrac = this.dispHp / TUNE.PLAYER_HP;
    const col = frac > 0.6 ? 0x5cff7a : frac > 0.3 ? 0xffc23a : 0xff3a2a;
    const ox = this.panelShake > 0 ? randi(-2, 2) : 0, oy = this.panelShake > 0 ? randi(-2, 2) : 0;   // bar jolts when hit
    for (let i = 0; i < 20; i++) {
      const t = (i + 1) / 20, x = 26 + i * 14 + ox, y = 42 + oy;
      let c = 0x1a1d22;
      if (t <= frac + 1e-6) c = col; else if (t <= dfrac + 1e-6) c = 0xffffff;
      g.fillStyle(c, 1); g.fillRect(x, y, 12, 20);
      if (c === col) { g.fillStyle(0xffffff, 0.28); g.fillRect(x, y, 12, 4); g.fillStyle(0x000000, 0.25); g.fillRect(x, y + 16, 12, 4); }
    }
    const dk = this.dashK;                                              // dash meter under the health bar
    g.fillStyle(0x1a1d22, 1); g.fillRect(26, 65, 278, 4);
    g.fillStyle(dk >= 1 ? 0x46e6ff : 0x2a6a80, 1); g.fillRect(26, 65, Math.round(278 * dk), 4);
    if (dk >= 1) { g.fillStyle(0xffffff, 0.35); g.fillRect(26, 65, 278, 1); }
    const SW = Math.floor(720 / WEAPONS.length);
    WEAPONS.forEach((w, i) => {
      const x = 14 + i * SW, y = 82, sel = i === this.weapon;
      g.fillStyle(sel ? 0x2a1806 : 0x06070a, sel ? 0.9 : 0.6); g.fillRect(x, y, SW - 2, 46);
      g.lineStyle(2, sel ? 0xff8a1f : 0x2a2f37, 1); g.strokeRect(x + 1, y + 1, SW - 4, 44);
    });
    panel(756, 10, 190, 76);
    if (this.styleA > 0.02) {                                           // progress toward the next style rank
      g.fillStyle(0x06070a, 0.7 * this.styleA); g.fillRect(850, 190, 94, 6);
      g.fillStyle(Phaser.Display.Color.HexStringToColor(STYLE_RANKS[Math.max(0, this.shownRank)].c).color, this.styleA); g.fillRect(851, 191, Math.round(92 * (this.styleFrac || 0)), 4);
    }
    if (this.rampA > 0 && !this.overOn) { g.fillStyle(0x06070a, 0.7); g.fillRect(850, 226, 94, 6); g.fillStyle(0xff7a2a, 1); g.fillRect(851, 227, Math.round(92 * this.rampA / TUNE.RAMPAGE.time), 4); }
    g.fillStyle(0x000000, 0.55 * this.hint1.alpha); g.fillRect(0, 494, VIEW_W, 38);   // backing strip for the control hints
    const fg = this.flashG; fg.clear();
    let red = this.hurtA * 0.6;
    if (this.hp > 0 && this.hp <= 30) red = Math.max(red, 0.2 + 0.14 * Math.sin(time / 160));
    const edge = (color, a) => {
      for (let i = 0; i < 6; i++) {
        const t = 12, ins = i * t, al = a * (1 - i / 6) * 0.5;
        fg.fillStyle(color, al);
        fg.fillRect(ins, ins, VIEW_W - ins * 2, t); fg.fillRect(ins, VIEW_H - ins - t, VIEW_W - ins * 2, t);
        fg.fillRect(ins, ins + t, t, VIEW_H - ins * 2 - t * 2); fg.fillRect(VIEW_W - ins - t, ins + t, t, VIEW_H - ins * 2 - t * 2);
      }
    };
    if (red > 0.01) edge(0xff1010, red);
    if (this.healA > 0.01) edge(0x30ff60, this.healA * 0.5);
    if (this.rampA > 0) edge(0xff6a10, 0.22 + 0.1 * Math.sin(time / 90));
    if (this.flashA > 0.01) { fg.fillStyle(0xfff2d8, this.flashA); fg.fillRect(0, 0, VIEW_W, VIEW_H); }
  }
}

// =============================================================================
//  BOOT
// =============================================================================
window.game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: VIEW_W,
  height: VIEW_H,
  backgroundColor: '#050608',
  pixelArt: true,                                    // nearest-neighbour + rounded pixels for crisp art
  audio: { noAudio: true },                          // all sound is our own Web Audio graph
  physics: { default: 'arcade', arcade: { gravity: { x: 0, y: TUNE.GRAVITY }, debug: false } },
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, TitleScene, GameScene, HudScene],
});
// A hidden tab stops the game loop but not our own Web Audio graph: without this the music, the hum and any
// weapon loop that was running (hose, arc, cryo, minigun motor) keep playing over a frozen game.
game.events.on('hidden', () => {
  const gs = game.scene.getScene('Game');                              // a hidden tab pauses the run; coming back waits on the menu
  if (gs && gs.sys.isActive() && gs.state === 'play' && !gs.paused) gs.pauseGame();
  if (Sfx.ctx && Sfx.ctx.state === 'running') Sfx.ctx.suspend().catch(() => {});
});
game.events.on('visible', () => { if (Sfx.ctx && Sfx.ctx.state === 'suspended') Sfx.ctx.resume().catch(() => {}); });
</script>
