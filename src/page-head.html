                          and fades back for 1.4 s. Shoot it when it comes out.
    Chiller 80 HP ....... a cryo trooper that keeps 140-240 px off and lobs a frost ball at your feet every ~2.8 s:
                          it ices a 74 px stretch of floor for 8 s (6 and a 1.5 s chill if it lands on you). On ice
                          you're slow to get going and slower to stop. Fire melts it; its tank ices the floor when
                          it dies.
    Warhorn 110 HP ...... a tracked bot with a brass horn that hangs back 170-320 px. Every ~7 s it winds up (0.7 s)
                          and blasts: every other foe within 230 px takes half damage for 6 s (gold chevrons).
    THE SMELTER (boss) .. 900 HP, 4 phases (66% / 33% / 15%), rage speeds it up; at 15% it OVERHEATS (armour blows
                          off, x1.8 speed, a fan of ten slag shells every 4 s); slag mortars (3-5 shells,
                          landing markers, burning puddles), leap slams that send ground shockwaves,
                          sweeping slag breath (phase 2+), summons ticks (phase 3); +50% crits on
                          its head vent. Letterbox intro, boss bar with phase notches.
    THE FOREMAN (boss) .. Wrecking Yard boss, also in BOSS RUSH and alternating with the Smelter every sixth
                          wave in OVERTIME and DAILY: a four-legged crane walker,
                          1400 HP. It stomps after you and cycles attacks every ~2.2 s: SLAM (0.7 s tell, 22 up close
                          and a floor shockwave each way) and RIVET SPRAY (bursts of five). Below 60% its armour comes
                          off and it adds MAGNET (drags you in for 1.6 s) and HOUNDS (two at a time, four at most).
                          Below 25% its core is exposed (x1.3) and it rages. Its hounds die with it.
    Campaign ............ five acts with two operations each: MELT FLOOR, FURNACE, SORTING LINE, WRECKING YARD
                          and POWERHOUSE. Each lift carries weapon, perks, stats and settings. Health rises to at
                          least 60, 75, 75 and 80 on arrival, unless the Vampire mutator is active. In the Sorting
                          Line, hold at each coolant valve for 0.8 s in order to unlock the lift. Continue or R
                          restores the act's checkpoint. New Campaign replaces it and victory clears it.
                          Speedrunner requires a clear in under 10 minutes without Continue or a checkpoint retry.
    Campaign weapons .... start with the Nailgun, earn the Shotgun after the first patrol, then get new weapons
                          when operations or reinforcement breaks begin. Weapon cards show the use and equip
                          control. Hotkeys, cycling and the wheel share the issued arsenal. Earlier checkpoints
                          keep their equipped weapon. OVERTIME, DAILY and BOSS RUSH start with the full arsenal.
    Belts + presses ..... ARENA 03: four belts (60 px/s on the floor, 50 on the upper decks) carry you, foes, drums,
                          gibs and corpses. Three crusher presses (under the upper belts and over the control block)
                          run on a cycle: 0.6 s tell (red light, dust, creak), 0.1 s slam (40 to you and a fling,
                          200 to foes, 60 to bosses; drums go off, props under them are crushed, corpses burst),
                          0.45 s hold, 1 s rise.
    Live rails .......... ARENA 05: four floor rails in two banks. Every ~4-5.5 s one bank hums (1.2 s, flashing
                          yellow), then goes live for 2.2 s: 6 per 0.3 s to you if you're standing on it, 12 and a
                          jolt to any foe on it. The banks take turns; the walkways and decks above are safe.
    Wrecking ball ....... ARENA 04: an iron ball on a 12-tile chain swings across the middle from a gantry under the roof
                          (+/-0.95 rad, a 5.2 s period). At speed it hits foes for 60 (scaled by speed) and flings
                          them, hits you for 25 and knocks you aside, smashes crates and girders and lights and
                          launches drums. Standing on the dais under it is safe; jumping into it is not.
    Fire jets ........... ARENA 02: three vents on the furnace top. Every ~9 s the grate flares (1.1 s tell), then they
                          fire left to right (1.3 s each, 0.3 s apart): 76 px columns that burn you for 9 per 0.25 s
                          and fling you out, and set alight any foe, corpse, drum or tar up there.
    Campaign encounters . LOCKDOWN opens with grunts. BLACKOUT cuts the lights on the second squad. In the
                          FURNACE, the vents are already active when the second squad brings SLAG RAIN. Showers
                          last 7 to 9 s, with 5 to 7 s clear and 1.2 s warning. They spare platforms and drums.
                          The rain and vents stop before the Demolition Team. The Gunship gets its own fight.
                          GRAVITY LOSS introduces the Hounds in separate squads, then the Linkers, Heavy Support,
                          and Containment Crew in pairs before the Juggernaut. SORTING SHIFT starts the belts.
                          MELTDOWN stops the presses before the tide and drains the floor for the Wyrm.
                          DEMOLITION and LIVE CIRCUIT give time to reach safe ground before machinery starts.
                          The Foreman releases the ball and the Smelter charges the rails in phase two.
                          The first five operations move from a two-grunt patrol to six foes in the Sorting Line.
                          The Furnace uses smaller squads and gives bosses a longer warning. Incoming damage
                          climbs from 80% to full across these five operations.
                          Lockdown and Slag Rain clear with health restored to at least 75 and 65,
                          except with the Vampire mutator. Machinery and ground fires clear between operations.
                          Medkits restock between waves.
    Perks ............... after every wave but the last, pick 1 of 3 (keys 1-3, click, or the pad). The campaign
                          opens with a choice of HOLLOW POINTS, VAMPIRE or DOUBLE JUMP. HOLLOW POINTS +20%
                          damage, HAIR TRIGGER 20% faster fire, VAMPIRE 3 HP a kill, IRON BOOTS double kick damage
                          and 30% faster kicks, DOUBLE JUMP, BLAST SHIELD self-blasts -75%, AFTERBURNER dash cd -40%
                          and dashes ignite, SCAVENGER 15% orb drops, SHOWBOAT style x1.5, VOLATILE 1 in 4 kills
                          explode (radius 40), ADRENALINE +50% damage under 35 HP, BARBED PLATE contact hurts the
                          toucher for 20. They last the run (and ride the lift); the HUD lists them.
    Wall slide / jump ... push into a wall while falling to slide. Jump near a wall while rising or falling, or just
                          after leaving it. Hold toward the wall for a short kick and jump again to climb, or
                          steer away for a wider jump. A jump pressed just before contact is buffered.
    Steam pipes ......... valves on the walls at waist height (4 in ARENA 01, 6 in ARENA 02). Shoot or blast one and it
                          bursts: a 56 px jet of steam for 3.5 s (foes 6 per 0.25 s and shoved, you 5 per 0.3 s).
                          New pipes every wave.
    Medals .............. 27 to earn (untouchable wave, 5 trick shots, a x20 combo, 5 executions, 15 burning
                          kills, 5 crush kills, 3 shock combos, 3 supercombines, 5 wall splats, kills with 15 guns, 3
                          rampages, a 6-kill chain, 8 katana deflects, 6 elites, 3 wrecking-ball kills, 5 microwave pops, beating the Foreman, a win with a mutator on, 15 ratbots, beating Boss Rush, 5 kills with one mini-nuke, gold-plating a gun, 10 dodges, a 4-limpet detonation, beating the Smelter, a sub-10-minute win in one run, a
                          Brutal win). A gold toast pops when one lands; the results list the run's medals and the
                          title counts the collection (localStorage).
    Last-kill cam ....... the final kill of each wave: 0.9 s of slow-mo, a zoom punch, an impact frame and the camera
                          on the body.
    Multikills .......... kills under 650 ms apart chain: DOUBLE KILL, TRIPLE, QUAD, PENTA, then MASSACRE, punched in
                          under the callouts with a rising sting, style for each and a beat of hit-stop from three.
    Elites .............. in later campaign squads and OVERTIME (one more every two waves, up to 6) some
                          foes warp in as elites: +30% HP, a coloured aura and a diamond over the head, and a trait.
                          ARMORED (steel): double HP. SHIELDED (cyan): a bubble worth 40% of its HP that soaks hits
                          and comes back 3.5 s after the last one. VOLATILE (orange): blows up 0.4 s after it dies.
                          REGEN (green): heals 6% a second once it's gone 2 s unhurt. Each drops two health orbs.
    OVERTIME ............ endless mode (E on the title screen, Y on a pad): no placed wave; 8 foes a wave, +2 each
                          (22 max), tougher kinds mixing in, a mini-boss every 3rd of 6 waves and a boss every
                          6th (the Smelter and THE FOREMAN take turns), enemy HP +7% a wave, a random modifier 45% of the time, a perk after every wave and a
                          new arena every 3 (all five in turn). Every foe type but the bosses can turn up. It ends when you die; the best wave reached is kept and shown on the title.
    Supply drops ........ ~22 s into a wave and every 40 s after, a crate floats down on a chute near you; touch it for a
                          power-up. Elites (150+ HP) drop a capsule 30% of the time. OVERDRIVE (x2 damage, 10 s),
                          HASTE (x1.5 fire rate, +25% run speed, 10 s), AEGIS (soaks the next 60 damage), MEDPACK
                          (+40 HP). An aura and a HUD line show what's running.
    Boss rush ........... BOSS RUSH on the title: the Juggernaut, the Gunship, the Slag Wyrm, the Foreman and the
                          Smelter back to back across the three arenas, a perk between each. Its best run is kept on
                          its own ('CLEARED' and the grade on the title); the RUSHER medal is for beating it.
    Daily run ........... DAILY on the title: an OVERTIME run seeded by today's UTC date, so everyone gets the same arena,
                          the same two starting perks, the same waves and the same wave modifiers. Your best wave
                          for the day is kept. A run (and R) keeps its day past 00:00 UTC.
    Mastery ............. every kill with a gun counts toward it for good (localStorage). 25 / 100 / 250 kills earn
                          its 1st / 2nd / 3rd star, each worth +5% damage with that gun; a callout and a chime mark
                          a new star, and the wheel shows each gun's stars. Three stars and the gun is gold-plated: it
                          glints gold in your hand, on the HUD ribbon and in the ARMORY.
    Lifetime ............ kills, runs, deaths and time played are kept (localStorage) and shown on the ARMORY page.
    Title menu .......... CAMPAIGN, OVERTIME, DAILY, BOSS RUSH, CODEX, ARMORY (every gun with its line, key, kills and mastery
                          pips), MEDALS, OPTIONS. CODEX: every foe, a grey silhouette until you've met it, with a line on
                          each; 66 to a page, Q/E, the mouse wheel or a click on PAGE turns them), MEDALS (the gallery in three columns, earned in gold), OPTIONS
                          (OPTION_ITEMS: difficulty, music, SFX, shake, post FX, flashes: FULL or REDUCED, which drops impact frames and dims screen
                          flashes, mutator, keys: rebinds the keyboard, controls). Play modes in the left column, extras in the right. Keyboard, mouse or pad; Esc / B, < BACK
                          or a right click backs out. A touch-only device with no pad is told it needs a keyboard and mouse or a gamepad, and runs
                          wait for a key press or pad input. Met foes are kept in localStorage.
    Gamepad ............. standard-mapping pads: LS move (down + A drops), RS aim (crosshair rides 70 px out), RT fire,
                          LT mine, A jump, B dash, X kick, Y hook, RB sentry, hold LB for the wheel (RS picks), D-pad
                          up/down cycle, Start pause. Menus: D-pad / LS, A pick, B back. Rumble follows screen shake.
                          Radial dead zone 0.22; aim assist leans the aim 60% onto a foe within 0.2 rad / 260 px.
    Impact frames ....... 2-3 stark black-and-white frames on executions, kill-cams, shock combos, supercombines and
                          mini-boss deaths (a white flash with post FX off).
    Difficulty .......... picked on the title screen (A/D, remembered): EASY (you take x0.6, enemies have x0.8
                          HP, score x0.7), NORMAL, BRUTAL (x1.4 damage taken, x1.25 enemy HP, score x1.5).
    Mutators ............ OPTIONS > MUTATOR (one at a time, remembered, shown on the title): GLASS CANNON (you deal and
                          take double), SWARM (each wave half again as big, foes a third weaker), MOON BOOTS (low
                          gravity every wave), LIGHTS OUT (every wave in the dark), VAMPIRE (every kill heals 4, no
                          medkits). The MUTANT medal is for winning the campaign with one on.
    Meltdown tide ....... during LAST SHIFT in the campaign, the floor seams glow for 2.2 s, then slag floods
                          the ground floor 28 px deep (3 s rise, 6 s hold, 3 s drain). Wading burns 5 per 0.4 s.
                          Slag ignites anything vulnerable to fire, sets off ticks and drums, and melts gibs.
    Music ............... synthwave soundtrack from music_bank.js (rendered by dev/synthwave): title theme,
                          MELT FLOOR (operations 1–2), SLAG RAIN (later operations), THE SMELTER (Foreman and
                          Smelter fights), clear / game over
                          jingles. Stage loops are muffled until you're noticed and open up as the fight heats
                          up. B flips to the procedural 132 BPM drum + bass loop (the fallback without the bank).
    SFX ................. AudioGen sample bank from sfx_bank.js (dev/sfxgen) over the procedural synth; N flips
                          to the synth versions (the fallback without the bank). M mutes all audio (remembered; the
                          HUD shows MUTED), and all audio pauses while the tab is hidden.
    Hearing ............. gunfire alerts enemies within 210-270 px, explosions within 300 px
    Player .............. 100 HP, 750 ms i-frames; contact dmg grunt 12 / heavy 20,
                          heavy stomp 15, drone bolt 10; four +30 health packs in the arena
    Pause (Esc / P) ..... pause menu (PAUSE_ITEMS): resume, retry act or restart, music and SFX volume, screen shake (0-100%
                          in quarter steps with A/D or Enter; remembered), post FX on/off, flashes full/reduced, controls
                          (every key and pad binding), quit. Retry / restart
                          and quit need a second pick (moving off, Esc or B cancels), and the list stops at both ends. Physics, timers and weapon
                          loops stop and the music muffles; buffs, i-frames and enemy tells pick up where they left
                          off, and paused time doesn't count toward the run time. Hiding the tab or moving focus to
                          another window pauses too, and coming back waits on the menu. Esc on the results screen goes back to the title.
    Post FX (V) ......... Phaser 4 camera filters on the world (not the HUD): bloom, a barrel-warp pulse on nearby
                          blasts, colour grading (rampage saturation, low-health desaturation, grey on death and
                          while paused). The choice is remembered in localStorage.
    Results ............. stats count up (with your top three guns by kills, the biggest single hit and, if you died,
                          what killed you, or the hazard that did), then a grade (S-D from completion, accuracy, best
                          style and damage taken) and a score (x the difficulty's multiplier); the best score is kept in
                          localStorage and shown on the title screen with its difficulty (and mutator, if one was on). R and Esc wait for the results
                          (the run's records are saved when they appear). R / Enter retries the checkpoint after a
                          campaign defeat when one exists. Otherwise it starts a fresh run. Mid-run, R needs a second
                          press within 2 s (RESTART_CONFIRM_MS); the first shows a prompt under the objective banner.
                          The Lab's R resets at once.
    HUD ................. a ribbon of 9 weapon slots, the gun in hand in the middle and four either side, that slides
                          as you swap (stolen guns grey out); dash meter under the health bar; red markers round you show where a hit
                          came from; arrows at the screen edge point to off-screen enemies once 5 or fewer are left
                          (and to a boss), and those last few stop lurking and come looking for you (one stuck
                          against a wall it can't climb for 4 s warps to the ground point nearest you); lance charge
                          ring and hornet lock pips at the crosshair. Damage numbers
                          step aside from ones still rising nearby.
  =============================================================================
-->
